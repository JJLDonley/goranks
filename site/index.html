<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rank Estimate Training</title>
<style>
  :root {
    --surface: #fcfcfb; --panel: #ffffff; --ink: #1f1f1e; --ink-2: #4a4a47; --muted: #6b6b68; --grid: #e4e4e1;
    --band: #f0f0ec; --accent: #2a78d6;
    --c-overall: #2a78d6; --c-opening: #eb6834; --c-middle: #1baf7a; --c-end: #eda100;
  }
  * { box-sizing: border-box; }
  /* One centred column: readable on wide monitors, never squashed on narrow ones (it scrolls instead). */
  .wrap { max-width: 1320px; min-width: 760px; margin: 0 auto; }
  html { overflow-x: auto; }
  .card svg { max-height: 230px; display: block; }
  .card svg.full { max-height: none; }   /* the timeline and the butterfly: shown at their own size, never squeezed */
  #boardbox svg { max-height: none; }
  .grid .card svg { max-height: 200px; }
  .moveinfo { margin-top: 8px; height: 20px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movekey { height: 18px; line-height: 18px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movetable { width: 100%; table-layout: fixed; margin-top: 4px; }
  .movetable td { height: 24px; overflow: hidden; text-overflow: ellipsis; }
  .wheregrid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .maps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 640px; }
  .maptitle { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .mapkey { font-size: 12px; color: var(--ink); margin: 6px 0 10px; }
  .mapkey span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-left: 8px; }
  .mapkey .k1 { background: #1f1f1e; margin-left: 0; } .mapkey .k2 { background: #b0b0ab; } .mapkey .k3 { background: #2a78d6; }
  table.areagrid { border-collapse: separate; border-spacing: 4px; width: 100%; max-width: 640px; }
  td.areacell { text-align: left; vertical-align: top; padding: 6px 8px; border-radius: 4px; font-size: 12px; white-space: normal; }
  td.areacell.corner { background: #d9cfb6; } td.areacell.side { background: #e6dec9; } td.areacell.center { background: #efe9db; }
  td.areacell .an { font-weight: 600; color: var(--ink-2); margin-bottom: 2px; text-transform: capitalize; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { background: var(--band); border-radius: 4px; padding: 6px 10px; min-width: 110px; }
  .stat .sv { font-size: 16px; font-weight: 600; } .stat .sl { font-size: 11px; color: var(--muted); }
  h3.sub { font-size: 14px; margin: 18px 0 8px; }
  .gamegrid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 8px; }
  /* Game page (2026-11-27 redesign): player cards, a large board on the left, one tabbed analysis panel on the right */
  .pcards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 14px; }
  .pcard { background: var(--panel); border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; }
  .pcard .who { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .pcard .stone { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #444; flex: none; }
  .pcard .perf { font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -0.3px; }
  .pcard .perf small { font-size: 14px; font-weight: 500; color: var(--ink); }
  .pcard .perflabel { font-size: 12px; color: var(--ink); }
  .pcard .note { font-size: 12px; color: #9a5b12; margin-top: 2px; min-height: 16px; }
  .pcard .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .pcard .kpi .v { font-size: 17px; font-weight: 600; }
  .pcard .kpi .l { font-size: 11px; color: var(--ink); }
  .movestrip { margin-bottom: 12px; padding: 10px 14px; }
  .movestrip .mhead { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
  .movestrip .mcells { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
  .movestrip .mv { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movestrip .ml { font-size: 11px; color: var(--ink); }
  .movestrip .mnote { font-size: 12px; margin-top: 6px; }
  @media (max-width: 1100px) { .movestrip .mcells { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .gv { display: grid; grid-template-columns: minmax(420px, 1.05fr) minmax(420px, 1fr); gap: 16px; align-items: start; }
  .gv-board { position: sticky; top: 8px; }
  .gv-panel { min-height: 400px; }
  .gtabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--grid); margin: -4px -4px 10px; padding: 0 4px; }
  .gtabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; }
  .gtabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
  .probs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .method { max-width: 920px; line-height: 1.55; color: var(--ink); }
  .method h2 { margin-top: 4px; } .method h3 { margin: 26px 0 8px; font-size: 16px; }
  .method .lead { font-size: 15px; }
  .method ol, .method ul { padding-left: 22px; } .method li { margin: 4px 0; }
  table.mdef { width: 100%; border-collapse: collapse; }
  table.mdef th { text-align: left; vertical-align: top; width: 230px; padding: 7px 12px 7px 0; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--grid); font-size: 13px; }
  table.mdef td { padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 13px; text-align: left; white-space: normal; }
  table.mdef th { white-space: normal; }
  tr.cur td { background: #dbe9fb; font-weight: 600; }
  table.sortable th { cursor: pointer; user-select: none; }
  table.sortable th:hover { color: var(--accent); }
  table.sortable th[data-sorted]::after { content: " " attr(data-sorted); font-size: 10px; }
  .probs table td, .probs table th { padding: 4px 6px; }
  @media (max-width: 1100px) { .gv, .pcards, .probs { grid-template-columns: 1fr; } .gv-board { position: static; } }
  #gametable { overflow-x: auto; }
  #gametable td.l:first-child { max-width: 300px; white-space: normal; }
  .cellnote { font-size: 11px; color: #9a5b12; font-weight: 400; margin-top: 2px; }
  body { margin: 0; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--surface); }
  header { padding: 18px 24px 0; }
  h1 { margin: 0; font-size: 22px; }
  .sub { color: var(--ink); font-size: 13px; margin-top: 2px; }
  nav { display: flex; gap: 4px; padding: 14px 24px 0; border-bottom: 1px solid var(--grid); }
  nav button { border: 0; background: none; padding: 8px 14px; font: inherit; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 16px 24px 40px; }
  h2 { font-size: 16px; margin: 22px 0 8px; }
  table { border-collapse: collapse; background: var(--panel); }
  th, td { padding: 4px 10px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; vertical-align: bottom; border-bottom: 1px solid var(--grid); }
  td.l, th.l { text-align: left; }
  tr.first td { font-weight: 600; }
  tr.shade td { background: var(--band); }
  tr.thin td { color: var(--muted); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #e8f0fb; }
  .legend-note { color: var(--muted); font-size: 12px; max-width: 1100px; margin-top: 8px; }
  details.howto { margin: 14px 0 6px; max-width: 1100px; font-size: 12.5px; }
  details.howto summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
  details.howto h3 { font-size: 13px; margin: 14px 0 4px; color: var(--ink); background: none; padding: 0; text-align: left; }
  details.howto table { margin: 0; }
  details.howto td { white-space: normal; text-align: left; vertical-align: top; padding: 4px 10px; }
  details.howto td.k { white-space: nowrap; font-weight: 600; color: var(--ink); width: 1%; }
  details.howto p, details.howto li { color: var(--ink-2); margin: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
  .card { background: var(--panel); border: 1px solid var(--grid); border-radius: 6px; padding: 10px 12px; }
  .card h3 { margin: 0 0 2px; font-size: 13px; }
  .card .unit { color: var(--muted); font-size: 11px; }
  .keys { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); margin: 6px 0 0; flex-wrap: wrap; }
  .keys span::before { content: ""; display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .filters select, .filters input { font: inherit; padding: 4px 8px; border: 1px solid var(--grid); border-radius: 4px; background: var(--panel); }
  .tip { position: fixed; pointer-events: none; background: #1f1f1e; color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 4px; z-index: 10; display: none; white-space: nowrap; }
  .back { border: 1px solid var(--grid); background: var(--panel); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .muted { color: var(--muted); }
  svg text { font: 11px system-ui, sans-serif; fill: var(--ink); }   /* black chart text (the user's call) */
  svg .lbl { fill: var(--ink); }
  .scroll { overflow-x: auto; }
  /* Moves list: 10 rows visible, the rest scroll; the column labels stay in view (sticky header). */
  .movescroll { overflow: auto; border-bottom: 1px solid var(--grid); }
  .movescroll th { position: sticky; top: 0; z-index: 1; background: var(--surface); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Rank Estimate Training</h1>
  <div class="sub" id="stamp"></div>
</header>
<nav>
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="ranks">Ranks</button>
  <button data-tab="games">Games</button>
  <button data-tab="method">How the data is made</button>
</nav>
<main id="main"></main>
</div>
<div class="tip" id="tip"></div>
<script src="data/summary.js"></script>
<script>
"use strict";
// Names fixed by the user (GoRanks/CLAUDE.md): phases and columns, in this order.
const PHASES = ["overall", "opening", "middle", "end"];
const PHASE_NAMES = { overall: "Overall", opening: "Opening", middle: "Middle", end: "Endgame" };
const COLUMNS = [
  ["games", "Games Analyzed"], ["moves", "Moves Analyzed"], ["top1", "Best Move %"], ["accuracy", "Accuracy"], ["match_pct", "Match %"],
  ["mean_loss", "Avg Point Loss"], ["critical_top1", "Key Moment Top Move %"],
  ["difficulty_9d", "Game Difficulty (9d) %"], ["hard_positions", "Tough Spots (per game)"],
  ["hard_found_pct", "Key Move Found % (per game)"], ["engine_like_pct", "Engine Likeness %"],
];
const POS_COLUMNS = [["same_area_pct", "Same Area %"], ["direction_err_per100", "Direction Errors %"],
  ["local_err_per100", "Local Errors %"], ["resolved_pct", "Resolved-Area Play %"], ["low_value_pct", "Lower-Value Area %"],
  ["forced_error_pct", "Forced Error %"], ["forcing_induced_pct", "Forcing Success %"],
  ["same_shape_pct", "Same Shape %"], ["bad_shape_pct", "Empty Triangle %"]];
const BANDS = ["K1", "K2", "K3", "K4", "K5", "D1-3", "D4-6", "D7-9", "Pro"];
const WRAP = { "Games Analyzed": "Games<br>Analyzed", "Moves Analyzed": "Moves<br>Analyzed", "Best Move %": "Best<br>Move %",
  "Avg Point Loss": "Avg Point<br>Loss", "Key Moment Top Move %": "Key Moment<br>Top Move %",
  "Game Difficulty (9d) %": "Game Difficulty<br>(9d) %", "Tough Spots (per game)": "Tough Spots<br>(per game)", "Key Move Found % (per game)": "Key Move Found %<br>(per game)",
  "Engine Likeness %": "Engine<br>Likeness %", "AI-like span (moves)": "AI-like span<br>(moves)" };
const head = t => WRAP[t] || esc(t);
const MIN_MOVES = 50;
const CHARTS = [   // [column, title, unit, transform]
  ["top1", "Best Move %", "% of moves", v => 100 * v],
  ["mean_loss", "Avg Point Loss", "points per move", v => v],
  ["critical_top1", "Key Moment Top Move %", "% of key moments", v => 100 * v],
  ["difficulty_9d", "Game Difficulty (9d) %", "a 9d's error rate, %", v => v],
  ["hard_found_pct", "Key Move Found % (per game)", "average per-game % of Tough Spots (from 5 Tough Spots on)", v => v],
  ["engine_like_pct", "Engine Likeness %", "% of moves (move 41 on, not decided)", v => v],
];

const data = window.GR_SUMMARY || { rows: [] };
// Eras (data separation): band and rank rows come per era plus "all"; game rows carry their game's era.
const ERAS = [["pre", "Pre-AI (≤2015)"], ["early", "Early AI (2016–18)"], ["cur", "Current AI (2019+)"]];
const ERA_NAME = Object.fromEntries(ERAS);
const SERVERS = [["kgs", "KGS"], ["ogs", "OGS"], ["pro", "Pro"]];
const SERVER_NAME = Object.fromEntries(SERVERS);
const COLORS = [["B", "Black"], ["W", "White"]];   // a rank's Black and White players are measured apart
const COLOR_NAME = Object.fromEntries(COLORS);
let pick = { band: "", era: "", server: "", color: "" };   // the dropdown choices (shared by every tab)
let rows = [];
function applyEra() {
  rows = data.rows.filter(r => r.level === "game"
    ? (!pick.era || r.era === pick.era) && (!pick.server || r.server === pick.server) && (!pick.color || r.color === pick.color)
    : (r.era || "all") === (pick.era || "all") && (r.server || "all") === (pick.server || "all") &&
      (r.color || "all") === (pick.color || "all"));
}
applyEra();
const eraTitle = () => (pick.server ? " · " + SERVER_NAME[pick.server] : "") + (pick.era ? " · " + ERA_NAME[pick.era] : "") +
  (pick.color ? " · as " + COLOR_NAME[pick.color] : "");
document.getElementById("stamp").textContent = `Generated ${data.generated || "?"} · ${new Set(rows.filter(r => r.level === "game").map(r => r.id)).size} games · ` +
  `${new Set(rows.filter(r => r.level === "game" && r.complete !== 0).map(r => r.id)).size} games in the totals`;
const main = document.getElementById("main");
const tip = document.getElementById("tip");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLOR = { overall: css("--c-overall"), opening: css("--c-opening"), middle: css("--c-middle"), end: css("--c-end") };
const rankValue = r => { const n = parseInt(r); return r.endsWith("k") ? 1 - n : r.endsWith("d") ? n : 10; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function fmt(col, v) {
  if (v === null || v === undefined || v === "") return "–";
  if (col === "top1" || col === "critical_top1") return `${Math.round(100 * v)} %`;
  if (col === "hard_found_pct") return `${Math.round(v)} %`;
  if (col === "difficulty_9d" || col === "engine_like_pct" || col === "match_pct") return `${(+v).toFixed(1)} %`;
  if (col === "accuracy") return (+v).toFixed(1);
  if (POS_COLUMNS.some(c => c[0] === col)) return `${(+v).toFixed(1)} %`;
  if (col === "mean_loss") return (+v).toFixed(2);
  return String(v);
}

// ---- tables ------------------------------------------------------------------------------------
function groupedTable(groups, firstHeader, cols, opts = {}) {
  // groups: [{label, rows: {phase: row}, onclick?}]
  let h = `<div class="scroll"><table><tr><th class="l">${firstHeader}</th><th class="l">Phase</th>` +
          cols.map(c => `<th>${head(c[1])}</th>`).join("") + "</tr>";
  groups.forEach((g, gi) => {
    PHASES.forEach(ph => {
      const r = g.rows[ph];
      if (!r) return;
      const cls = [gi % 2 === 0 ? "shade" : "", ph === "overall" ? "first" : "",
                   opts.muteThin !== false && r.moves < MIN_MOVES ? "thin" : "", g.click ? "click" : ""].join(" ");
      h += `<tr class="${cls}" ${g.click ? `data-go="${esc(g.click)}"` : ""}><td class="l">${ph === "overall" ? esc(g.label) + (g.sub ? `<div class="cellnote">${esc(g.sub)}</div>` : "") : ""}</td>` +
           `<td class="l">${PHASE_NAMES[ph]}</td>` + cols.map(c => `<td>${esc(fmt(c[0], r[c[0]]))}</td>`).join("") + "</tr>";
    });
  });
  return h + "</table></div>";
}

function levelGroups(level, key, order) {
  const out = [];
  order.forEach(k => {
    const byPhase = {};
    rows.filter(r => r.level === level && r[key] === k).forEach(r => byPhase[r.phase] = r);
    if (Object.keys(byPhase).length) out.push({ label: k, rows: byPhase });
  });
  return out;
}

// ---- charts (SVG, with hover) --------------------------------------------------------------------
function lineChart(title, unit, xs, series, opts = {}) {
  // series: [{name, color, points: [{x index, y, thin, tip}]}]
  const W = 400, H = 220, L = 44, R = 70, T = 14, B = 36;
  const all = series.flatMap(s => s.points.map(p => p.y)).filter(v => v !== null);
  if (!all.length) return "";
  let lo = Math.min(0, ...all), hi = Math.max(...all);
  if (hi === lo) hi = lo + 1;
  hi += (hi - lo) * 0.08;
  const x = i => L + (xs.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (xs.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">`;
  const ticks = 4;
  for (let k = 0; k <= ticks; k++) {
    const v = lo + (hi - lo) * k / ticks, yy = y(v);
    s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${css("--grid")}"/>` +
         `<text x="${L - 6}" y="${yy + 4}" text-anchor="end">${+v.toFixed(v < 10 ? 1 : 0)}</text>`;
  }
  const every = Math.ceil(xs.length / 16);
  xs.forEach((lab, i) => { if (i % every === 0) s += `<text x="${x(i)}" y="${H - B + 16}" text-anchor="middle">${esc(lab)}</text>`; });
  const ends = [];
  series.forEach(se => {
    const pts = se.points.filter(p => p.y !== null);
    if (!pts.length) return;
    s += `<polyline fill="none" stroke="${se.color}" stroke-width="2" points="${pts.map(p => `${x(p.x)},${y(p.y)}`).join(" ")}"/>`;
    pts.forEach(p => {
      s += `<circle cx="${x(p.x)}" cy="${y(p.y)}" r="4" fill="${p.thin ? "#fff" : se.color}" stroke="${p.thin ? se.color : "#fff"}" stroke-width="${p.thin ? 1.6 : 1.2}"/>` +
           `<circle cx="${x(p.x)}" cy="${y(p.y)}" r="11" fill="transparent" data-tip="${esc(p.tip)}"/>`;
    });
    ends.push([se.name, x(pts[pts.length - 1].x), y(pts[pts.length - 1].y)]);
  });
  ends.sort((a, b) => a[2] - b[2]);
  for (let i = 1; i < ends.length; i++) if (ends[i][2] - ends[i - 1][2] < 12) ends[i][2] = ends[i - 1][2] + 12;
  ends.forEach(([n, ex, ey]) => s += `<text class="lbl" x="${ex + 8}" y="${ey + 4}">${esc(n)}</text>`);
  s += "</svg>";
  return `<div class="card"><h3>${esc(title)}</h3><div class="unit">${esc(unit)}</div>${s}</div>`;
}

function phaseCharts(level, key, order) {
  const keys = `<div class="keys">${PHASES.map(p => `<span style="--c:${COLOR[p]}">${PHASE_NAMES[p]}</span>`).join("")}</div>`;
  const cards = CHARTS.map(([col, title, unit, tf]) => lineChart(title, unit, order, PHASES.map(ph => ({
    name: PHASE_NAMES[ph], color: COLOR[ph],
    points: order.map((k, i) => {
      const r = rows.find(r => r.level === level && r[key] === k && r.phase === ph);
      let v = r ? r[col] : null;
      if (col === "hard_found_pct" && r && (r.hard_total ?? r.hard_positions) < 5) v = null;
      v = v === null || v === undefined || v === "" ? null : tf(+v);
      return { x: i, y: v, thin: r && r.moves < MIN_MOVES,
               tip: r ? `${k} · ${PHASE_NAMES[ph]}: ${fmt(col, r[col])} (${r.moves} moves, ${r.player_games} games)` : "" };
    }),
  })))).join("");
  return keys + `<div class="grid">${cards}</div>`;
}


// ---- "How the data is made": the full legend key (shown under every table) ------------------------------------
const HOWTO_ROWS = (title, rows) => `<h3>${title}</h3><table>` +
  rows.map(([k, v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`).join("") + `</table>`;
// "How the data is made": its own top tab (2026-11-27), written as a methodology — definitions first, then the
// models, then the limits. Kept in step with the code (gorank/*.py) and with reports/Rank benchmark log.md.
const MTABLE = rows => `<table class="mdef">` + rows.map(([k, v]) => `<tr><th scope="row">${k}</th><td>${v}</td></tr>`).join("") + `</table>`;
const HOWTO = `<article class="method">
<h2>How the data is made</h2>
<p class="lead">This page defines every figure shown on this site: where the games come from, which games are included,
how each move is analysed, how each measure is computed, and how the Performance Rank and the game timeline are
estimated. It closes with the known limitations.</p>

<h3>1. Sources</h3>
${MTABLE([
  ["KGS", "The u-go.net archive of the KGS Go Server: games with at least one player of 4 dan or stronger, up to April 2019. Ranks are those recorded in the game record."],
  ["OGS", "The data dump of the Online Go Server (za3k.com/ogs, published with OGS's permission). Ranks are taken from OGS's game data."],

<h3>2. Inclusion criteria</h3>
<p>A game is included only if all of the following hold:</p>
<ol>
  <li>It is played on a 19×19 board and has at least 50 moves.</li>
  <li>Both players have a settled rank between 15 kyu and 9 dan (professionals only from the professional source).</li>
  <li>The players' declared ranks are at most two ranks apart.</li>
  <li>Neither player is a program. Programs are identified by name (GoRanks' own list and the lists KataGo uses for its training data), by playing volume (300 or more games at 12 or more per day) and, on OGS, by the account type.</li>
  <li>Neither the game nor either account has been flagged by the maintainer for suspected use of AI assistance.</li>
  <li>Every move has a complete analysis (Section 3). Only such games appear anywhere on this site.</li>
</ol>

<h3>3. Analysis of each position</h3>

(61–150) or Endgame (151 onward).</p>

<h3>5. Performance Rank</h3>
<p>The Performance Rank estimates the level at which a player played in one game. It is not the player's rank.</p>
<ol>
  <li><b>Evidence.</b> Two kinds: how closely the moves resemble each of the 17 human rank profiles (human-style play), and engine measures (point loss, blunders, and how often the move was KataGo's first choice).</li>
  <li><b>Model.</b> A ridge regression from this evidence to the declared rank, trained on all included games. Every estimate is made by a model that has seen none of that player's games (cross-validation by player).</li>
  <li><b>Calibration.</b> Regression pulls estimates toward the average rank. The estimate is moved halfway toward a per-server correction that, rank by rank, maps the average estimate back to the declared rank; KGS and OGS are corrected separately because their ranks are different scales.</li>
  <li><b>Uncertainty (±).</b> The precision with which one game measures the level played, about 1.2 ranks for a whole game, widened when the human-style evidence and the engine measures disagree. A disagreement of 2 ranks or more is stated beside the rank; engine measures far stronger than human-style play is what very strong, unusual or AI-assisted play looks like.</li>
  <li><b>Scope.</b> The declared rank of the player is not an input. A player may play above or below their declared rank in any one game.</li>
</ol>

<h3>9. Limitations</h3>
<ul>
  <li>One game is a small sample: a single game estimates the level played to about ±1.2 ranks.</li>
  <li>Declared ranks are themselves approximate, and KGS and OGS ranks are not on the same scale.</li>
  <li>The KataGo-Human profiles describe the human play the network was trained on; older games may compare differently.</li>
  <li>Opening stretches tend to read high: memorised openings and standard sequences match KataGo at any strength.</li>
  <li>Engine Likeness is not calibrated against confirmed cases and is not evidence of AI use on its own.</li>
</ul>

const GAME_COLS = COLUMNS.slice(1).concat([["ai_like_span", "AI-like span (moves)"]]);
const COLOR_NAMES = { B: "Black", W: "White" };
const SIDE = { B: "#1f1f1e", W: "#9a9a96" };   // series colour per player in the game graphs
let gameFilter = { band: "", rank: "", q: "", handicap: "" };

function gameIndex() {   // id -> {file, players: {B: {phase: row}, W: {...}}}
  const out = {};
  rows.filter(r => r.level === "game").forEach(r => {
    const g = out[r.id] = out[r.id] || { id: r.id, file: r.file, players: {} };
    (g.players[r.color] = g.players[r.color] || {})[r.phase] = r;
  });
  return out;
}
const handicapLabel = r => r && r.handicap >= 2 ? `Handicap ${r.handicap}` : "Even";
// A negative loss: the position looked better for the player after the move than KataGo's shallow search estimated
// before it (search depth / noise). Shown as a gain; averages count it as 0, error logic never counts it.
const lossText = v => v === null || v === undefined ? "–" : v < 0 ? `${(+v).toFixed(2)} (gain)` : (+v).toFixed(2);
const playerInfo = (g, c) => {
  const r = (g.players[c] || {}).overall;
  if (r) return `${r.player || COLOR_NAMES[c]} (${r.rank})`;
  const o = (g.players[c === "B" ? "W" : "B"] || {}).overall;   // a player without a usable rank: name from the game
  return o && o.opponent ? `${o.opponent} (unranked)` : "–";
};

function games() {
  const idx = gameIndex();
  const list0 = Object.values(idx).filter(g => g.players.B || g.players.W);
  const any = g => (g.players.B || g.players.W).overall || {};
  const bands = BANDS.filter(b => list0.some(g => ["B", "W"].some(c => g.players[c] && g.players[c].overall && g.players[c].overall.band === b)));
  const ranksL = [...new Set(rows.filter(r => r.level === "game").map(r => r.rank))].sort((a, b) => rankValue(a) - rankValue(b));
  const has = (g, f) => ["B", "W"].some(c => g.players[c] && g.players[c].overall && f(g.players[c].overall));
  const list = list0
    .filter(g => !gameFilter.band || has(g, r => r.band === gameFilter.band))
    .filter(g => !gameFilter.rank || has(g, r => r.rank === gameFilter.rank))
    .filter(g => !gameFilter.handicap || (gameFilter.handicap === "even") === (any(g).handicap < 2))
    .filter(g => !gameFilter.q || (g.file + " " + playerInfo(g, "B") + " " + playerInfo(g, "W")).toLowerCase().includes(gameFilter.q.toLowerCase()))
    .sort((a, b) => (any(a).date || "").localeCompare(any(b).date || "") || a.file.localeCompare(b.file));
  let h = `<div class="filters">Rank band <select id="fb"><option value="">all</option>${bands.map(b => `<option ${b === gameFilter.band ? "selected" : ""}>${b}</option>`).join("")}</select>
    ${eraOptions()}
    Rank <select id="fr"><option value="">all</option>${ranksL.map(b => `<option ${b === gameFilter.rank ? "selected" : ""}>${b}</option>`).join("")}</select>
    Handicap <select id="fh"><option value="">all</option><option value="even" ${gameFilter.handicap === "even" ? "selected" : ""}>Even</option><option value="hc" ${gameFilter.handicap === "hc" ? "selected" : ""}>Handicap</option></select>
    Search <input id="fq" placeholder="game or player" value="${esc(gameFilter.q)}"> <span class="muted">${list.length} games — click one to open it</span></div>`;
  const side = (g, c, k) => { const r = (g.players[c] || {}).overall; return r ? fmt(k, r[k]) : "–"; };
  h += `<div class="scroll"><table class="sortable"><tr><th class="l">Game</th><th class="l">Date</th><th class="l">Black</th><th class="l">White</th><th class="l">Handicap</th>` +
       `<th>Best Move %<br>B · W</th><th>Avg Point Loss<br>B · W</th><th>Game Difficulty (9d) %<br>B · W</th><th>Engine Likeness %<br>B · W</th><th class="l">Note</th></tr>`;
  list.forEach((g, i) => {
    const partial = ["B", "W"].some(c => g.players[c] && g.players[c].overall && g.players[c].overall.complete === 0) ? "Partial (not in totals)" : "";
    h += `<tr class="click ${i % 2 === 0 ? "shade" : ""}" data-go="${esc(g.id)}"><td class="l">${esc(g.file)}</td><td class="l">${esc(any(g).date || "")}</td>` +
      `<td class="l">${esc(playerInfo(g, "B"))}</td><td class="l">${esc(playerInfo(g, "W"))}</td><td class="l">${handicapLabel(any(g))}</td>` +
      ["top1", "mean_loss", "difficulty_9d", "engine_like_pct"].map(k => `<td>${side(g, "B", k)} · ${side(g, "W", k)}</td>`).join("") +
      `<td class="l muted">${partial}</td></tr>`;
  });
  main.innerHTML = h + "</table></div>";
  document.getElementById("fb").onchange = e => { gameFilter.band = e.target.value; games(); };
  hookEra(games);
  document.getElementById("fr").onchange = e => { gameFilter.rank = e.target.value; games(); };
  document.getElementById("fh").onchange = e => { gameFilter.handicap = e.target.value; games(); };
  document.getElementById("fq").oninput = e => { gameFilter.q = e.target.value; games(); const f = document.getElementById("fq"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); };
}

// ---- board ------------------------------------------------------------------------------------------
const COLS_GTP = "ABCDEFGHJKLMNOPQRST";
function gtpXY(mv, size) { if (!mv || mv.toLowerCase() === "pass") return null; return [COLS_GTP.indexOf(mv[0].toUpperCase()), size - parseInt(mv.slice(1))]; }
function boardAt(board, n) {   // stones after the first n moves (captures applied)
  const size = board.size, st = new Map(), key = (x, y) => x + "," + y;
  const nb = (x, y) => [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < size && b < size);
  const group = (x, y) => { const c = st.get(key(x, y)), seen = new Set([key(x, y)]), todo = [[x, y]]; let libs = 0;
    while (todo.length) { const [a, b] = todo.pop(); nb(a, b).forEach(([p, q]) => { const k = key(p, q), v = st.get(k);
      if (!v) libs++; else if (v === c && !seen.has(k)) { seen.add(k); todo.push([p, q]); } }); }
    return { stones: [...seen], libs }; };
  (board.setup || []).forEach(([c, mv]) => { const p = gtpXY(mv, size); if (p) st.set(key(...p), c); });
  for (let i = 0; i < n && i < board.moves.length; i++) {
    const [c, mv] = board.moves[i], p = gtpXY(mv, size); if (!p) continue;
    st.set(key(...p), c);
    nb(...p).forEach(([a, b]) => { const v = st.get(key(a, b)); if (v && v !== c) { const g = group(a, b); if (!g.libs) g.stones.forEach(k => st.delete(k)); } });
    const own = group(...p); if (!own.libs) own.stones.forEach(k => st.delete(k));
  }
  return st;
}
function boardSVG(board, n, marks) {   // the position after n moves; marks: {last, best, color, own}
  const size = board.size, c = 26, pad = 22, W = pad * 2 + c * (size - 1);
  let s = `<svg viewBox="0 0 ${W} ${W}" width="100%" role="img" aria-label="board"><rect width="${W}" height="${W}" fill="#e3c08a" rx="4"/>`;
  for (let i = 0; i < size; i++) {
    s += `<line x1="${pad}" x2="${pad + c * (size - 1)}" y1="${pad + c * i}" y2="${pad + c * i}" stroke="#5a4a32" stroke-width="0.8"/>` +
         `<line y1="${pad}" y2="${pad + c * (size - 1)}" x1="${pad + c * i}" x2="${pad + c * i}" stroke="#5a4a32" stroke-width="0.8"/>`;
  }
  (size === 19 ? [3, 9, 15] : []).forEach(a => [3, 9, 15].forEach(b => s += `<circle cx="${pad + c * a}" cy="${pad + c * b}" r="3" fill="#5a4a32"/>`));
  if (marks && marks.own) {   // KataGo's ownership of this position: black / white squares, stronger = more certain
    for (let i = 0; i < size * size && i < marks.own.length; i++) {
      const v = (marks.own.charCodeAt(i) - 97) * 10 - 100, a = Math.abs(v) / 100;
      if (a < 0.15) continue;
      const x = i % size, y = Math.floor(i / size);
      s += `<rect x="${pad + c * x - c * 0.45}" y="${pad + c * y - c * 0.45}" width="${c * 0.9}" height="${c * 0.9}" fill="${v > 0 ? "#1f1f1e" : "#ffffff"}" fill-opacity="${(0.55 * a).toFixed(2)}"/>`;
    }
  }
  boardAt(board, n).forEach((col, k) => { const [x, y] = k.split(",").map(Number);
    s += `<circle cx="${pad + c * x}" cy="${pad + c * y}" r="${c * 0.47}" fill="${col === "B" ? "#1f1f1e" : "#f7f7f4"}" stroke="#333" stroke-width="${col === "B" ? 0 : 0.8}"/>`; });
  // marks.last: the move just played (the position is after it) — a ring in the opposite colour on the stone, as
  // game viewers mark the last move; a blue ring around it when it was KataGo's best. marks.best otherwise: a blue
  // circle where KataGo would have played.
  const same = marks && marks.best && marks.last && marks.best.toUpperCase() === marks.last.toUpperCase();
  if (marks && marks.best && !same) { const p = gtpXY(marks.best, size); if (p) s += `<circle cx="${pad + c * p[0]}" cy="${pad + c * p[1]}" r="${c * 0.42}" fill="none" stroke="#2a78d6" stroke-width="3"/>`; }
  if (marks && marks.last) {
    const p = gtpXY(marks.last, size);
    if (p) {
      const cx = pad + c * p[0], cy = pad + c * p[1];
      if (same) s += `<circle cx="${cx}" cy="${cy}" r="${c * 0.56}" fill="none" stroke="#2a78d6" stroke-width="3"/>`;
      s += `<circle cx="${cx}" cy="${cy}" r="${c * 0.24}" fill="none" stroke="${marks.color === "W" ? "#1f1f1e" : "#f7f7f4"}" stroke-width="2.4"/>`;
    }
  }
  if (marks && marks.next) {   // the next move: a small dot in that player's colour on the empty point
    const p = gtpXY(marks.next, size);
    if (p) s += `<circle cx="${pad + c * p[0]}" cy="${pad + c * p[1]}" r="${c * 0.2}" fill="${marks.nextColor === "W" ? "#f7f7f4" : "#1f1f1e"}" stroke="${marks.nextColor === "W" ? "#333" : "#f7f7f4"}" stroke-width="1.2"/>`;
  }
  return s + "</svg>";
}

// ---- per-move graphs for both players -------------------------------------------------------------
function perMoveChart(title, unit, moves, key, opts) {
  // moves: {B: [...], W: [...]}; x = move number; a cursor line at the current move; click -> jump there.
  const W = 760, H = 170, L = 40, R = 12, T = 10, B = 24;
  const all = ["B", "W"].flatMap(c => moves[c].map(m => Object.assign({ color: c }, m))).filter(m => m[key] !== null && m[key] !== undefined);
  if (!all.length) return "";
  const xmax = Math.max(...all.map(m => m.move)), xmin = 1;
  const tf = opts.tf || (v => v), hi = opts.max || Math.max(1, ...all.map(m => tf(m[key])));
  const x = v => L + (W - L - R) * (v - xmin) / Math.max(1, xmax - xmin), y = v => T + (H - T - B) * (1 - v / hi);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">`;
  [60, 150].forEach(b => { if (b < xmax) s += `<line x1="${x(b + 0.5)}" x2="${x(b + 0.5)}" y1="${T}" y2="${H - B}" stroke="${css("--grid")}" stroke-dasharray="4 3"/>`; });
  (opts.spans || []).forEach(([a, b, c]) => s += `<rect x="${x(a) - 3}" y="${T}" width="${Math.max(6, x(b) - x(a) + 6)}" height="${H - T - B}" fill="${c === "B" ? "#1f1f1e" : "#9a9a96"}" opacity="0.10"/>`);
  for (let k = 0; k <= 4; k++) { const v = hi * k / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--grid")}" opacity="0.6"/><text x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${+v.toFixed(hi < 5 ? 1 : 0)}</text>`; }
  for (let t = 20; t <= xmax; t += 20) s += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${t}</text>`;
  const bw = Math.max(1.5, (W - L - R) / (xmax - xmin + 1) - 1);
  ["B", "W"].forEach(c => {
    const pts = all.filter(m => m.color === c);
    if (opts.bars) pts.forEach(m => { const v = Math.min(hi, Math.max(0, tf(m[key])));
      s += `<rect x="${x(m.move) - bw / 2}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" fill="${SIDE[c]}" opacity="${m.decided ? 0.3 : 1}"/>`; });
    else {   // a gap in the data stays a gap: a new line segment wherever moves of this player are missing
      let seg = [];
      const flush = () => { if (seg.length > 1) s += `<polyline fill="none" stroke="${SIDE[c]}" stroke-width="1.8" points="${seg.join(" ")}"/>`;
        else if (seg.length === 1) { const [px, py] = seg[0].split(","); s += `<circle cx="${px}" cy="${py}" r="1.8" fill="${SIDE[c]}"/>`; } seg = []; };
      pts.forEach((m, i) => { if (i && m.move - pts[i - 1].move > 2) flush(); seg.push(`${x(m.move)},${y(Math.min(hi, tf(m[key])))}`); });
      flush();
    }
    if (opts.mark) pts.filter(opts.mark).forEach(m => s += `<circle cx="${x(m.move)}" cy="${y(Math.min(hi, tf(m[key])))}" r="4" fill="#eb6834" stroke="#fff" stroke-width="1"/>`);
    pts.forEach(m => s += `<rect x="${x(m.move) - bw / 2 - 1}" y="${T}" width="${bw + 2}" height="${H - T - B}" fill="transparent" data-move="${m.move}" data-tip="${esc(opts.tip(m))}" style="cursor:pointer"/>`);
  });
  if (opts.cursor) s += `<line x1="${x(opts.cursor)}" x2="${x(opts.cursor)}" y1="${T}" y2="${H - B}" stroke="#2a78d6" stroke-width="1.5"/>`;
  return `<div class="card" style="margin-bottom:10px"><h3>${esc(title)}</h3><div class="unit">${esc(unit)}</div>${s}</div>`;
}
// ---- game timeline: rank over the game, key moments, engine likeness (lanes per player, like Zhangqi's chart) ----
// Rank lane: each move shows the Performance Rank of the 30 moves of that player around it (KataGo's human rank
// profiles, calibrated on whole games); dark and labelled where the window is confident (± 2 ranks or less), faint
// where it is not. Key moments: Tough Spots (a 9d errs >= 50 %), green when the player lost under 2 points there,
// red otherwise. Engine likeness: the AI-like spans. Hover for numbers, click to go to the move.
const TL_SURE = 2.0, TL_MAYBE = 3.0;
// Rank colour: the validated sequential blue ramp (dataviz reference palette), steps 100 (15k) to 400 (9d) only —
// black text clears 4.5:1 on all of them (5.1 at 400; 450 and darker fall below), so every label stays black.
const RANK_RAMP = ["#cce3fd", "#b6d5f8", "#9dc8f7", "#84b9f3", "#6aabf1", "#519ced", "#338ced"];
function rankShade(v) {
  const t = Math.max(0, Math.min(1, (v + 14) / 23)) * (RANK_RAMP.length - 1);
  const i = Math.min(RANK_RAMP.length - 2, Math.floor(t)), f = t - i;
  const a = RANK_RAMP[i], b = RANK_RAMP[i + 1], mix = k => Math.round(parseInt(a.substr(k, 2), 16) * (1 - f) + parseInt(b.substr(k, 2), 16) * f);
  return `rgb(${mix(1)}, ${mix(3)}, ${mix(5)})`;
}
function rankLabel(v) { const r = Math.round(v); return r >= 1 ? `${r}d` : `${1 - r}k`; }
function timelineChart(d) {
  const all = ["B", "W"].flatMap(c => d.moves[c]);
  if (!d.stretches) return "";
  // drawn at the panel's width (about 600 px), so its text is shown near its real size
  const W = 610, L = 92, R = 74, LANE = 22, GAP = 6, BLOCK = 3 * LANE + 2 * GAP, T = 22, AX = 24, SEP = 28;
  const xmax = d.board ? d.board.moves.length : Math.max(...all.map(m => m.move));
  const H = T + 2 * BLOCK + SEP + AX;
  const x = v => L + (W - L - R) * (v - 1) / Math.max(1, xmax - 1);
  const cw = Math.max(2, (W - L - R) / Math.max(1, xmax) * 2);   // one player's move is every other move
  let s = `<svg class="full" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Game timeline">`;
  [60, 150].forEach(b => { if (b < xmax) s += `<line x1="${x(b + 0.5)}" x2="${x(b + 0.5)}" y1="${T}" y2="${H - AX}" stroke="${css("--grid")}" stroke-dasharray="4 3"/>`; });
  ["B", "W"].forEach((c, i) => {
    const y0 = T + i * (BLOCK + SEP), list = d.moves[c];
    const lane = k => y0 + k * (LANE + GAP);
    s += `<rect x="${L}" y="${y0 - 3}" width="${W - L - R}" height="${BLOCK + 6}" fill="${c === "B" ? "#f4e7e3" : "#e5ecf4"}" opacity="0.55" rx="4"/>`;
    s += `<text x="${L - 8}" y="${y0 - 7}" text-anchor="end" font-weight="700" font-size="13" fill="#111">${COLOR_NAMES[c]}</text>`;
    ["Rank", "Key moments", "Engine-like"].forEach((n, k) => s += `<text x="${L - 8}" y="${lane(k) + 15}" text-anchor="end" font-size="12" fill="#111">${n}</text>`);
    // rank lane: the player's stretches of steady play (after the opening), each the mean level of its own moves;
    // colour = rank, opacity = how sure (a short stretch says less), label when there is room
    ((d.stretches || {})[c] || []).forEach(([a, b, v, sd]) => {
      const x0 = x(a) - cw / 2, w = Math.max(3, x(b) - x(a) + cw);
      const unsure = sd > TL_MAYBE;   // a short stretch: dashed outline (the ± is on hover)
      const tip = `${COLOR_NAMES[c]}, moves ${a}–${b}: played like ${rankText(v)} ± ${sd.toFixed(1)} (the mean of these moves)` + (sd > TL_MAYBE ? " — a short stretch, so a rough reading" : "") + (a <= 40 ? " — opening moves often match KataGo from memory, so this can read high" : "");
      s += `<rect x="${x0 + 0.75}" y="${lane(0) + 0.75}" width="${Math.max(1.5, w - 1.5)}" height="${LANE - 1.5}" rx="3" fill="${rankShade(v)}" stroke="${unsure ? "#13243a" : "#fff"}" stroke-width="1.2" ${unsure ? 'stroke-dasharray="3 2"' : ""} data-move="${a}" data-tip="${esc(tip)}" style="cursor:pointer"/>`;
      if (w >= 30) s += `<text x="${x0 + w / 2}" y="${lane(0) + 15.5}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111" pointer-events="none">${rankText(v)}</text>`;
    });
    // key moments
    list.filter(m => m.p_err_9d >= 0.5).forEach(m => {
      const found = m.loss !== null && m.loss < 2;
      const tip = `Move ${m.move} (${COLOR_NAMES[c]}): Tough Spot (a 9d errs ${Math.round(100 * m.p_err_9d)} %) — ${found ? "found" : "missed"}, lost ${lossText(m.loss)}`;
      // found: a green dot; missed: a red cross — shape tells them apart, not colour alone
      const cx = x(m.move), cy = lane(1) + LANE / 2;
      s += found ? `<circle cx="${cx}" cy="${cy}" r="4.5" fill="#0aac23" stroke="#fff" stroke-width="1.5"/>`
                 : `<path d="M${cx - 4} ${cy - 4} L${cx + 4} ${cy + 4} M${cx - 4} ${cy + 4} L${cx + 4} ${cy - 4}" stroke="#dc3c3d" stroke-width="2.4" stroke-linecap="round"/>`;
      s += `<rect x="${cx - 6}" y="${lane(1)}" width="12" height="${LANE}" fill="transparent" data-move="${m.move}" data-tip="${esc(tip)}" style="cursor:pointer"/>`;
    });
    // engine-like spans
    spansOf(list, c).forEach(([a, b]) => {
      const tip = `${COLOR_NAMES[c]}: AI-like span, moves ${a}–${b} (Engine Likeness over 50 % on consecutive moves)`;
      s += `<rect x="${x(a) - 3}" y="${lane(2) + 2}" width="${Math.max(6, x(b) - x(a) + 6)}" height="${LANE - 4}" rx="3" fill="#fbb315" stroke="#191919" stroke-width="0.8" data-move="${a}" data-tip="${esc(tip)}" style="cursor:pointer"/>`;
    });
    // right: whole-game summary
    const tough = list.filter(m => m.p_err_9d >= 0.5), found = tough.filter(m => m.loss !== null && m.loss < 2).length;
    const row = (d.rows || []).find(r => r.color === c && r.phase === "overall");
    s += `<text x="${W - R + 8}" y="${lane(0) + 15}" font-size="12" font-weight="600" fill="#111">${row && row.performance != null ? `${rankText(row.performance)} ± ${row.performance_sd.toFixed(1)}` : ""}</text>`;
    s += `<text x="${W - R + 8}" y="${lane(1) + 15}" font-size="12" fill="#111">${found}/${tough.length} found</text>`;
  });
  for (let t = 20; t <= xmax; t += 20) s += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle" font-size="12" fill="#111">${t}</text>`;
  if (cur.move) s += `<line x1="${x(cur.move)}" x2="${x(cur.move)}" y1="${T - 4}" y2="${H - AX}" stroke="#2a78d6" stroke-width="1.5" pointer-events="none"/>`;
  return `<div class="chart"><h3 class="sub">Game timeline</h3><div style="color:#111;font-size:12px">Rank: the whole game cut into stretches where the level held steady, each showing the mean level of its moves (opening stretches tend to read high: memorised moves match KataGo; a dashed outline = a short stretch, a rough reading) · Key moments: Tough Spots, <span style="color:#0aac23">●</span> found / <span style="color:#dc3c3d">✕</span> missed · Engine-like: AI-like spans · hover for details, click to go to the move</div>${s}</svg></div>`;
}

function spansOf(list, color) {
  const out = []; let a = null, b = null;
  list.filter(m => m.counted === 1).forEach(m => {
    if (m.p_assisted > 0.5) { if (a === null) a = m.move; b = m.move; } else if (a !== null) { out.push([a, b, color]); a = null; }
  });
  if (a !== null) out.push([a, b, color]);
  return out;
}

// ---- one game ---------------------------------------------------------------------------------------
let cur = { id: null, game: null, move: 0 };

const GAME_TABS = [["timeline", "Timeline"], ["phases", "Phases"], ["problems", "Problem moves"], ["charts", "Charts"],
  ["where", "Area Chart"], ["moves", "All moves"]];
function playerCard(g, c, r) {
  const v = (k, f) => r && r[k] !== null && r[k] !== undefined && r[k] !== "" ? f(r[k]) : "–";
  return `<div class="pcard"><div class="who"><span class="stone" style="background:${c === "B" ? "#1f1f1e" : "#fafaf7"}"></span>${esc(COLOR_NAMES[c])} · ${esc(playerInfo(g, c))}</div>
    <div class="perf">${r && r.performance != null ? `${rankText(r.performance)} <small>± ${r.performance_sd.toFixed(1)}</small>` : "–"}</div>
    <div class="perflabel">Performance Rank (the level played in this game)</div>
    <div class="note">${esc(perfNote(r))}</div>
    <div class="kpis">
      <div class="kpi"><div class="v">${v("accuracy", x => (+x).toFixed(1))}</div><div class="l">Accuracy</div></div>
      <div class="kpi"><div class="v">${v("match_pct", x => (+x).toFixed(1) + " %")}</div><div class="l">Match %</div></div>
      <div class="kpi"><div class="v">${v("mean_loss", x => (+x).toFixed(2))}</div><div class="l">Avg Point Loss</div></div>
      <div class="kpi"><div class="v">${v("hard_found_pct", x => Math.round(+x) + " %")}</div><div class="l">Key Move Found %</div></div>
    </div></div>`;
}
function gameView(id) {
  const g = gameIndex()[id];
  if (!g) { main.innerHTML = `<p>Game not found.</p>`; return; }
  cur = { id, game: null, move: 0, tab: (cur && cur.tab) || "timeline" };
  const any = (g.players.B || g.players.W).overall || {};
  main.innerHTML = `<button class="back" id="back">← All games</button>
    <h2>${esc(g.file)} · ${esc(any.date || "")} · ${handicapLabel(any)}${any.komi !== "" && any.komi !== undefined ? " · komi " + esc(any.komi) : ""}</h2>
    ${["B", "W"].some(c => g.players[c] && g.players[c].overall && g.players[c].overall.complete === 0) ? `<p class="muted">Partially analysed: shown here, not counted in the totals.</p>` : ""}
    <div class="pcards" id="pcards">${["B", "W"].filter(c => g.players[c]).map(c => playerCard(g, c, g.players[c].overall)).join("")}</div>
    <div id="movestrip" class="card movestrip"></div>
    <div class="gv">
      <div id="boardbox" class="card gv-board">Loading…</div>
      <div class="card gv-panel"><div class="gtabs" id="gtabs">${GAME_TABS.map(([k, n]) => `<button data-tab="${k}" class="${k === cur.tab ? "on" : ""}">${n}</button>`).join("")}</div>
        <div id="gpanel">Loading…</div></div>
    </div>
`;
  document.getElementById("back").onclick = () => show("games");
  document.getElementById("gpanel").addEventListener("click", e => {   // sub-tabs: Phases (phase), Area Chart (player)
    const b = e.target.closest("[data-ph]"), a = e.target.closest("[data-area]");
    if (b) { cur.phaseTab = b.dataset.ph; renderPanel(); }
    if (a) { cur.areaTab = a.dataset.area; renderPanel(); }
  });
  document.getElementById("gtabs").onclick = e => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    cur.tab = b.dataset.tab;
    document.querySelectorAll("#gtabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === cur.tab));
    renderPanel();
  };
  loadGame(id, data => {
    if (!data || cur.id !== id) return;
    cur.game = data;
    if (data.rows) {   // this game's rows for every phase come with its file (the summary has Overall only)
      const byColor = {};
      data.rows.forEach(r => ((byColor[r.color] = byColor[r.color] || {})[r.phase] = r));
      cur.groups = ["B", "W"].filter(c => byColor[c]).map(c => ({ label: `${COLOR_NAMES[c]} · ${playerInfo(g, c)}`, rows: byColor[c] }));
      document.getElementById("pcards").innerHTML = ["B", "W"].filter(c => byColor[c]).map(c => playerCard(g, c, byColor[c].overall)).join("");
    }
    cur.move = Math.min(1, data.board ? data.board.moves.length : 0);
    drawGame();
  });
}

// The analysis panel: one tab at a time; the tabs that follow the board (timeline, charts) redraw as the move changes.
function renderPanel() {
  const d = cur.game, box = document.getElementById("gpanel");
  if (!d || !box) return;
  const tipf = mm => `Move ${mm.move} (${COLOR_NAMES[mm.color]}, ${PHASE_NAMES[mm.phase]}) — Played / Best Move: ${mm.played} / ${mm.engine_best}; Point Loss: ${lossText(mm.loss)}; Position Difficulty (9d): ${mm.p_err_9d === null ? "–" : Math.round(100 * mm.p_err_9d) + " %"}; Engine Likeness: ${mm.p_assisted == null ? "–" : Math.round(100 * mm.p_assisted) + " %"} — click to show on the board`;
  if (cur.tab === "timeline") box.innerHTML = timelineChart(d) || `<p>No timeline for this game.</p>`;
  else if (cur.tab === "phases") box.innerHTML = cur.groups ? butterfly(cur.groups) : "";
  else if (cur.tab === "problems") box.innerHTML = problemMoves(d);
  else if (cur.tab === "charts") {
    const spans = spansOf(d.moves.B, "B").concat(spansOf(d.moves.W, "W"));
    box.innerHTML = `<div class="keys"><span style="--c:${SIDE.B}">Black</span><span style="--c:${SIDE.W}">White</span><span style="--c:#eb6834">Tough Spot</span><span style="--c:#2a78d6">current move</span></div>` +
      perMoveChart("Point Loss", "points (capped at 15); dashed lines: Opening | Middle | Endgame", d.moves, "loss",
        { bars: true, tf: v => Math.max(0, v), max: 15, tip: tipf, cursor: cur.move }) +
      perMoveChart("Position Difficulty (9d)", "how often a 9d would go wrong in this position, %; dots: Tough Spots", d.moves, "p_err_9d",
        { tf: v => 100 * v, max: 100, mark: mm => mm.p_err_9d >= 0.5, tip: tipf, cursor: cur.move }) +
      perMoveChart("Engine Likeness", "P(AI-assisted), % (uncalibrated); shaded: AI-like spans" + (spans.length ? " — " + spans.map(s => `${COLOR_NAMES[s[2]]} ${s[0] === s[1] ? s[0] : s[0] + "–" + s[1]}`).join(", ") : ""),
        d.moves, "p_assisted", { tf: v => 100 * v, max: 100, spans, tip: tipf, cursor: cur.move });
  } else if (cur.tab === "where") {   // Area Chart: one player at a time (sub-tabs Black / White)
    const side = cur.areaTab || "B";
    box.innerHTML = !d.board ? "<p>No board data.</p>" :
      `<div class="gtabs" style="margin-bottom:8px">${["B", "W"].map(c => `<button data-area="${c}" class="${c === side ? "on" : ""}">${COLOR_NAMES[c]}</button>`).join("")}</div>` +
      `<div class="wheregrid">${whereCard(d, side)}</div>`;
  }
  else if (cur.tab === "moves") {
    const list = ["B", "W"].flatMap(c => d.moves[c]).sort((a, b) => a.move - b.move);
    box.innerHTML = `<div class="movescroll" style="max-height:640px"><table class="sortable"><tr><th>Move</th><th class="l">Player</th><th class="l">Played</th><th class="l">Best</th><th>Point Loss</th><th>Difficulty (9d)</th><th>Tough Spot</th><th>Engine Likeness</th></tr>` +
      list.map((m, i) => { const c = d.board ? d.board.moves[m.move - 1][0] : ""; return `<tr class="click ${m.move === cur.move ? "cur" : i % 2 ? "" : "shade"}" data-move="${m.move}"><td>${m.move}</td><td class="l">${COLOR_NAMES[c] || ""}</td><td class="l">${m.played}</td><td class="l">${m.engine_best}</td>` +
        `<td>${lossText(m.loss)}</td><td>${m.p_err_9d === null ? "–" : Math.round(100 * m.p_err_9d) + " %"}</td><td>${m.p_err_9d >= 0.5 ? "●" : ""}</td><td>${m.p_assisted === null || m.p_assisted === undefined ? "–" : Math.round(100 * m.p_assisted) + " %"}</td></tr>`; }).join("") + "</table></div>";
  }
}

// Phases tab: a butterfly chart — Black's bars to the left, White's to the right of each measure's name, one phase at
// a time (sub-tabs). Each measure has its own scale (0-100 for percentages; the larger of the two players for Avg Point
// Loss and Tough Spots). Values are black text at the bar ends; the players differ by side and header, not colour alone.
const BF_METRICS = [
  ["top1", "Best Move %", v => 100 * v, () => 100, v => `${Math.round(100 * v)} %`],
  ["accuracy", "Accuracy", v => v, () => 100, v => (+v).toFixed(1)],
  ["match_pct", "Match %", v => v, () => 100, v => `${(+v).toFixed(1)} %`],
  ["mean_loss", "Avg Point Loss", v => v, m => Math.max(3, m), v => (+v).toFixed(2)],
  ["critical_top1", "Key Moment Top Move %", v => 100 * v, () => 100, v => `${Math.round(100 * v)} %`],
  ["difficulty_9d", "Game Difficulty (9d) %", v => v, () => 100, v => `${(+v).toFixed(1)} %`],
  ["hard_positions", "Tough Spots (per game)", v => v, m => Math.max(1, m), v => `${Math.round(v)}`],
  ["hard_found_pct", "Key Move Found % (per game)", v => v, () => 100, v => `${Math.round(v)} %`],
  ["engine_like_pct", "Engine Likeness %", v => v, () => 100, v => `${(+v).toFixed(1)} %`],
];
function butterfly(groups) {
  const ph = cur.phaseTab || "overall";
  const byC = {}; groups.forEach(gr => { const c = gr.label.startsWith("Black") ? "B" : "W"; byC[c] = gr; });
  const tabs = `<div class="gtabs" id="phtabs" style="margin-bottom:8px">${PHASES.map(p => `<button data-ph="${p}" class="${p === ph ? "on" : ""}">${PHASE_NAMES[p]}</button>`).join("")}</div>`;
  const W = 610, MID = 170, ROW = 30, TOP = 34, side = (W - MID) / 2, PAD = 46;
  const rB = byC.B && byC.B.rows[ph], rW = byC.W && byC.W.rows[ph];
  const H = TOP + BF_METRICS.length * ROW + 8;
  let sv = `<svg class="full" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Black and White compared, ${PHASE_NAMES[ph]}">`;
  sv += `<text x="${side - 4}" y="16" text-anchor="end" font-size="13" font-weight="700" fill="#111">● ${esc(byC.B ? byC.B.label.replace(/^Black · /, "") : "Black")}</text>`;
  sv += `<text x="${side + MID + 4}" y="16" font-size="13" font-weight="700" fill="#111">○ ${esc(byC.W ? byC.W.label.replace(/^White · /, "") : "White")}</text>`;
  sv += `<text x="${W / 2}" y="16" text-anchor="middle" font-size="11" fill="#111">${byC.B && rB ? (rB.moves || "–") : "–"} / ${byC.W && rW ? (rW.moves || "–") : "–"} moves</text>`;
  BF_METRICS.forEach(([k, name, tf, maxf, f], i) => {
    const y = TOP + i * ROW, vb = rB && rB[k] != null && rB[k] !== "" ? tf(+rB[k]) : null, vw = rW && rW[k] != null && rW[k] !== "" ? tf(+rW[k]) : null;
    const mx = maxf(Math.max(vb || 0, vw || 0)), len = v => (side - PAD) * Math.max(0, Math.min(1, v / mx));
    if (i % 2 === 0) sv += `<rect x="0" y="${y - 4}" width="${W}" height="${ROW}" fill="#f3f2ee"/>`;
    sv += `<text x="${W / 2}" y="${y + 13}" text-anchor="middle" font-size="12" fill="#111">${name}</text>`;
    if (vb !== null) {
      const l = len(vb);
      sv += `<rect x="${side - l}" y="${y + 2}" width="${Math.max(l, 1)}" height="16" rx="3" fill="#2b2b29"><title>Black · ${name}: ${f(rB[k])}</title></rect>`;
      sv += `<text x="${side - l - 5}" y="${y + 14}" text-anchor="end" font-size="12" font-weight="600" fill="#111">${f(rB[k])}</text>`;
    }
    if (vw !== null) {
      const l = len(vw), x0 = side + MID;
      sv += `<rect x="${x0}" y="${y + 2}" width="${Math.max(l, 1)}" height="16" rx="3" fill="#d6d5d0" stroke="#2b2b29" stroke-width="1"><title>White · ${name}: ${f(rW[k])}</title></rect>`;
      sv += `<text x="${x0 + l + 5}" y="${y + 14}" font-size="12" font-weight="600" fill="#111">${f(rW[k])}</text>`;
    }
  });
  sv += `</svg>`;
  return tabs + sv + `<p style="font-size:12px;margin:6px 0 0">Longer bars are higher values; for Avg Point Loss lower is better. Game Difficulty and Tough Spots describe the positions the player faced, not how well they played.</p>`;
}

// Sortable lists: a click on a column header sorts the rows by that column (again: the other way). Numbers,
// percentages and "–" are read as numbers ("–" last); other columns sort as text.
function sortKey(text) {
  const t = text.replace(/[●%\s]/g, "").replace(/\(.*\)/, "");
  if (t === "" || t === "–" || t === "-") return null;
  const v = parseFloat(t.replace(",", ""));
  return isNaN(v) || !/^[-+]?[\d.,]+/.test(t) ? t.toLowerCase() : v;
}
document.addEventListener("click", e => {
  const th = e.target.closest("table.sortable th");
  if (!th) return;
  const table = th.closest("table"), head = th.parentElement, col = [...head.children].indexOf(th);
  const rows = [...table.querySelectorAll("tr")].filter(r => r !== head);
  const desc = !(table.dataset.sortCol == col && table.dataset.sortDir === "desc");
  rows.sort((a, b) => {
    const x = sortKey(a.children[col] ? a.children[col].textContent : ""), y = sortKey(b.children[col] ? b.children[col].textContent : "");
    if (x === null || y === null) return x === null ? (y === null ? 0 : 1) : -1;
    const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y));
    return desc ? -r : r;
  });
  rows.forEach(r => table.appendChild(r));
  table.dataset.sortCol = col; table.dataset.sortDir = desc ? "desc" : "asc";
  [...head.children].forEach(h => h.removeAttribute("data-sorted"));
  th.setAttribute("data-sorted", desc ? "▼" : "▲");
});

// Problem moves (Zhangqi's 问题手): each player's biggest losses (2+ points) and the Tough Spots they missed, worst first.
function problemMoves(d) {
  const col = c => {
    const ms = d.moves[c].filter(m => m.loss !== null && m.loss >= 2).sort((a, b) => b.loss - a.loss).slice(0, 12);
    if (!ms.length) return `<div><h3 class="sub">${COLOR_NAMES[c]}</h3><p>No move lost 2 points or more.</p></div>`;
    return `<div><h3 class="sub">${COLOR_NAMES[c]} — ${ms.length === 12 ? "12 biggest" : ms.length} losses of 2+ points</h3><table class="sortable"><tr><th>Move</th><th class="l">Played</th><th class="l">Best</th><th>Loss</th><th>Difficulty</th></tr>` +
      ms.map(m => `<tr class="click" data-move="${m.move}"><td>${m.move}</td><td class="l">${m.played}</td><td class="l">${m.engine_best}</td><td>${lossText(m.loss)}</td>` +
        `<td>${m.p_err_9d === null ? "–" : Math.round(100 * m.p_err_9d) + " %"}${m.p_err_9d >= 0.5 ? " ●" : ""}</td></tr>`).join("") + `</table></div>`;
  };
  return `<p style="margin-top:0">Click a move to see it on the board. ● = a Tough Spot (a 9d would go wrong there half the time or more): a loss there is easier to forgive.</p><div class="probs">${col("B")}${col("W")}</div>`;
}

// Performance Rank: the level this player played at in this game, from the rank profiles of their colour (7d-B /
// 7d-W); ± = how precisely the game's moves measure it (split-half: about 1.2 ranks for a whole game).
function rankText(v) { return v >= 1 ? `${v.toFixed(1)}d` : v <= 0 ? `${(1 - v).toFixed(1)}k` : v >= 0.5 ? "1d" : "1k"; }
function perfText(r) {
  return r && r.performance != null ? ` · Performance Rank ${rankText(r.performance)} ± ${r.performance_sd.toFixed(1)}` : "";
}
function perfNote(r) {   // performance_split: engine-side minus human-style (profile) estimate; 2+ ranks apart is named
  const s = r && r.performance_split;
  if (s == null || Math.abs(s) < 2) return "";
  return s > 0 ? `Engine stats ${s.toFixed(1)} ranks stronger than human-style play` : `Human-style play ${(-s).toFixed(1)} ranks stronger than engine stats`;
}

function moveRow(n) {   // the analysed row for move n (either player), or null
  if (!cur.game) return null;
  for (const c of ["B", "W"]) { const m = cur.game.moves[c].find(m => m.move === n); if (m) return Object.assign({ color: c }, m); }
  return null;
}

function drawGame() {
  const d = cur.game; if (!d) return;
  const total = d.board ? d.board.moves.length : 0;
  const m = moveRow(cur.move);
  const box = document.getElementById("boardbox");
  if (d.board) {
    // Fixed layout: controls, board, then a one-line label and the same detail rows for every move (values or "–"),
    // so nothing in the panel changes size while stepping through the game.
    const pct = v => v === null || v === undefined ? "–" : Math.round(100 * v) + " %";
    const label = `Move ${cur.move} of ${total}` + (m ? ` · ${COLOR_NAMES[m.color]} · ${PHASE_NAMES[m.phase]}` :
      ` · ${COLOR_NAMES[(d.board.moves[cur.move - 1] || [""])[0]] || ""} · not analysed`);
    const mover = COLOR_NAMES[(d.board.moves[cur.move - 1] || [""])[0]] || "";
    const boardKey = m ? (m.played.toUpperCase() === m.engine_best.toUpperCase()
        ? `After move ${cur.move} — ${mover} played ${m.played} (ringed), KataGo's Best Move (blue ring) · dot: next move`
        : `After move ${cur.move} — ${mover} played ${m.played} (ringed) · blue circle: KataGo's Best Move ${m.engine_best} · dot: next move`)
      : `After move ${cur.move} — ${mover}'s move is ringed · not analysed (no Best Move)`;
    box.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px">
        <button class="back" data-step="-10">«</button><button class="back" data-step="-1">◀</button>
        <input type="range" id="mvslider" min="1" max="${total}" value="${cur.move}" style="flex:1;min-width:80px">
        <button class="back" data-step="1">▶</button><button class="back" data-step="10">»</button>
        <label style="white-space:nowrap"><input type="checkbox" id="owntoggle" ${cur.showOwn ? "checked" : ""}> Ownership</label></div>` +
      boardSVG(d.board, cur.move, Object.assign(m ? { last: m.played, best: m.engine_best, color: m.color }
        : { last: d.board.moves[cur.move - 1] && d.board.moves[cur.move - 1][1], color: (d.board.moves[cur.move - 1] || [""])[0] },
        { own: cur.showOwn && d.board.own ? d.board.own[String(cur.move - 1)] : null,
          next: d.board.moves[cur.move] && d.board.moves[cur.move][1], nextColor: (d.board.moves[cur.move] || [""])[0] })) +
      "";
    // the current move's data: a strip between the player cards and the board (the user's layout, 2026-11-27)
    const cell = (k, v) => `<div class="mcell"><div class="mv">${v}</div><div class="ml">${k}</div></div>`;
    document.getElementById("movestrip").innerHTML =
      `<div class="mhead"><b>${esc(label)}</b><span>${esc(boardKey)}</span></div><div class="mcells">` +
      cell("Played / Best Move", m ? `${esc(m.played)} / ${esc(m.engine_best)}` : "–") +
      cell("Point Loss", m ? lossText(m.loss) : "–") +
      cell("Position Difficulty (9d)", m ? pct(m.p_err_9d) : "–") +
      cell("Tough Spot", m && m.p_err_9d >= 0.5 ? "yes" : m ? "no" : "–") +
      cell("Key Moment", m ? (m.critical ? "yes" : "no") : "–") +
      cell("Engine Likeness", m ? pct(m.p_assisted) : "–") +
      cell("Shape / Best Shape", m && m.shape ? `${esc(m.shape)} / ${esc(m.shape_best || "–")}` : "–") +
      `</div>${m && m.decided ? `<div class="mnote">Decided position: left out of Engine Likeness.</div>` : !m ? `<div class="mnote">This move is not analysed.</div>` : ""}`;
    document.getElementById("mvslider").oninput = e => { cur.move = +e.target.value; drawGame(); };
    const ot = document.getElementById("owntoggle");
    if (ot) ot.onchange = e => { cur.showOwn = e.target.checked; drawGame(); };
  } else box.innerHTML = `<p class="muted">No board data for this game.</p>`;
  if (["timeline", "charts", "moves"].includes(cur.tab)) renderPanel();   // these follow the current move
  else if (!document.getElementById("gpanel").dataset.drawn) { renderPanel(); document.getElementById("gpanel").dataset.drawn = 1; }
}

// ---- where they play: distribution map (4th-line areas) and the area table -----------------------------
const AREAS = [["corner-tl", "Corner, top left"], ["corner-tr", "Corner, top right"], ["corner-bl", "Corner, bottom left"],
  ["corner-br", "Corner, bottom right"], ["side-top", "Side, top"], ["side-bottom", "Side, bottom"], ["side-left", "Side, left"],
  ["side-right", "Side, right"], ["center", "Center"]];
const LIKED_PCT = 10;   // a move KataGo liked: at least 10 % of the best move's visits (Match); otherwise greyed by its loss
function distMap(board, moves, col, which) {
  // which = "played": the player's moves (solid when KataGo liked it, greyed by the loss otherwise);
  //         "best":   KataGo's best move in the same positions (blue)
  const size = board.size, c = 15, pad = 10, W = pad * 2 + c * (size - 1);
  const band = 4, lo = pad - c * 0.5, inner0 = pad + c * (band - 0.5), inner1 = pad + c * (size - band - 0.5), hi = pad + c * (size - 0.5);
  let s = `<svg viewBox="0 0 ${W} ${W}" width="100%" role="img" aria-label="${which === "best" ? "KataGo's best moves" : "moves played"}">`;
  // area tints: corners darkest, sides lighter, center plain
  s += `<rect x="${lo}" y="${lo}" width="${hi - lo}" height="${hi - lo}" fill="#efe9db" rx="3"/>`;
  [[lo, inner0], [inner1, hi]].forEach(([x0, x1]) => [[lo, inner0], [inner1, hi]].forEach(([y0, y1]) =>
    s += `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#d9cfb6"/>`));
  [[inner0, inner1, lo, inner0], [inner0, inner1, inner1, hi], [lo, inner0, inner0, inner1], [inner1, hi, inner0, inner1]].forEach(([x0, x1, y0, y1]) =>
    s += `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#e6dec9"/>`);
  for (let i = 0; i < size; i++)
    s += `<line x1="${pad}" x2="${pad + c * (size - 1)}" y1="${pad + c * i}" y2="${pad + c * i}" stroke="#c2b79e" stroke-width="0.5"/>` +
         `<line y1="${pad}" y2="${pad + c * (size - 1)}" x1="${pad + c * i}" x2="${pad + c * i}" stroke="#c2b79e" stroke-width="0.5"/>`;
  const base = col === "B" ? [31, 31, 30] : [250, 250, 247], grey = [176, 176, 171];
  moves.forEach(m => {
    const mv = which === "best" ? m.engine_best : m.played;
    const p = gtpXY(mv, size); if (!p) return;
    const cx = pad + c * p[0], cy = pad + c * p[1];
    if (which === "best") {
      s += `<circle cx="${cx}" cy="${cy}" r="${c * 0.36}" fill="#2a78d6" fill-opacity="0.75"><title>Move ${m.move}: KataGo's best ${mv}${m.played === mv ? " (the player played it)" : ", played " + m.played}</title></circle>`;
      return;
    }
    const liked = m.liked === 1 || (m.accuracy != null && m.accuracy >= LIKED_PCT);
    const t = liked ? 0 : 0.35 + 0.65 * Math.min(Math.max(m.loss || 0, 0), 10) / 10;   // worse = greyer
    const rgb = base.map((v, i) => Math.round(v + (grey[i] - v) * t));
    s += `<circle cx="${cx}" cy="${cy}" r="${c * 0.42}" fill="rgb(${rgb})" stroke="${col === "W" ? "#666" : "none"}" stroke-width="0.7"><title>Move ${m.move}: ${mv} — ${liked ? "KataGo liked it" : "Point Loss " + lossText(m.loss)} (KataGo's best ${m.engine_best})</title></circle>`;
  });
  return s + "</svg>";
}
function whereCard(d, col) {
  const moves = (d.moves[col] || []).filter(m => m.area);
  if (!moves.length) return "";
  const n = moves.length, pc = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const name = COLOR_NAMES[col];
  // the area table laid out like the board (top-left corner in the top-left cell, ...)
  const GRID = [["corner-tl", "side-top", "corner-tr"], ["side-left", "center", "side-right"], ["corner-bl", "side-bottom", "corner-br"]];
  const LABEL = Object.fromEntries(AREAS);
  const cell = k => {
    const played = moves.filter(m => m.area === k).length, best = moves.filter(m => m.area_best === k);
    const same = best.filter(m => m.same_area === 1).length;
    return `<td class="areacell ${k.split("-")[0]}"><div class="an">${LABEL[k].replace("Corner, ", "").replace("Side, ", "")}</div>
      <div><b>${pc(played, n)}</b> <span class="muted">${name}</span></div>
      <div><b>${pc(best.length, n)}</b> <span class="muted">KataGo</span></div>
      <div class="muted">agree ${pc(same, best.length)}</div></td>`;
  };
  const cnt = k => moves.filter(m => m[k] === 1).length;
  const stat = (label, v, tip) => `<div class="stat" title="${esc(tip)}"><div class="sv">${v}</div><div class="sl">${label}</div></div>`;
  return `<div class="card"><div style="font-weight:600;margin-bottom:8px">${name}</div>
    <table class="areagrid">${GRID.map(r => `<tr>${r.map(cell).join("")}</tr>`).join("")}</table>
    <div class="muted" style="margin:4px 0 8px">Each area: share of ${name}'s moves there, share of KataGo's best moves there, and how often ${name} also played there when KataGo's best was there. Same area overall: <b>${pc(cnt("same_area"), n)}</b>.</div>
    <div class="stats">
      ${stat("Direction errors", pc(cnt("direction_error"), n), "lost 2+ points in a different area from KataGo's best")}
      ${stat("Local errors", pc(cnt("local_error"), n), "lost 2+ points in the same area as KataGo's best")}
      ${stat("Resolved-area play", pc(cnt("resolved_play"), n), "played where ownership was already decided while KataGo's best was open")}
      ${stat("Lower-value area", pc(cnt("low_value_area"), n), "a different area from KataGo's best, losing 1+ point")}
      ${stat("Forced errors", pc(cnt("forced_error"), cnt("forced_faced")), cnt("forced_faced") + " forcing moves faced; answered locally but lost 2+")}
    </div>    <div class="maps">
      <div><div class="maptitle">${name}'s moves</div>${distMap(d.board, moves, col, "played")}</div>
      <div><div class="maptitle">KataGo's best moves</div>${distMap(d.board, moves, col, "best")}</div>
    </div>
    <div class="mapkey"><span class="k1" style="background:${col === "W" ? "#fafaf7" : "#1f1f1e"};border:${col === "W" ? "1px solid #666" : "none"}"></span> KataGo liked the move (10%+ of the best move's visits)
      <span class="k2"></span> greyer = the worse the move <span class="k3"></span> KataGo's best · hover a stone for details ·
      shading: corners / sides / center at the 4th line</div>
</div>`;
}

function step(k) { if (!cur.game || !cur.game.board) return; cur.move = Math.max(1, Math.min(cur.game.board.moves.length, cur.move + k)); drawGame(); }

// ---- routing, hover -----------------------------------------------------------------------------
function show(tab, arg) {
  if (tab !== "game") cur = { id: null, game: null, move: 0 };
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ({ overview, ranks, games, method: () => { main.innerHTML = HOWTO; }, game: () => gameView(arg) })[tab]();
  location.hash = arg ? `${tab}/${encodeURIComponent(arg)}` : tab;
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.tab));
main.addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if (go) return show("game", go.dataset.go);
  const st = e.target.closest("[data-step]"); if (st) return step(+st.dataset.step);
  const mv = e.target.closest("[data-move]"); if (mv && cur.game) { cur.move = +mv.dataset.move; drawGame(); }
});
document.addEventListener("keydown", e => {
  if (!cur.game || document.activeElement.tagName === "INPUT" && document.activeElement.type !== "range") return;
  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); } else if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
});
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (t && t.dataset.tip) { tip.textContent = t.dataset.tip; tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
  else tip.style.display = "none";
});
const [t0, a0] = location.hash.slice(1).split("/");
show(["overview", "ranks", "games", "method", "game"].includes(t0) ? t0 : "overview", a0 ? decodeURIComponent(a0) : undefined);
</script>
</body>
</html>
