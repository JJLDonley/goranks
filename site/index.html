<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rank Estimate Training</title>
<style>
  :root {
    --surface: #fcfcfb; --panel: #ffffff; --ink: #1f1f1e; --ink-2: #4a4a47; --muted: #6b6b68; --grid: #e4e4e1;
    --band: #f0f0ec; --accent: #2a78d6;
    --c-overall: #2a78d6; --c-opening: #eb6834; --c-middle: #1baf7a; --c-end: #eda100;
  }
  * { box-sizing: border-box; }
  /* One centred column: readable on wide monitors, never squashed on narrow ones (it scrolls instead). */
  .wrap { max-width: 1320px; min-width: 760px; margin: 0 auto; }
  html { overflow-x: auto; }
  .card svg { max-height: 230px; display: block; }
  .card svg.full { max-height: none; }   /* the timeline and the butterfly: shown at their own size, never squeezed */
  #boardbox svg { max-height: none; }
  .grid .card svg { max-height: 200px; }
  .moveinfo { margin-top: 8px; height: 20px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movekey { height: 18px; line-height: 18px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movetable { width: 100%; table-layout: fixed; margin-top: 4px; }
  .movetable td { height: 24px; overflow: hidden; text-overflow: ellipsis; }
  .wheregrid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .maps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 640px; }
  .maptitle { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .mapkey { font-size: 12px; color: var(--ink); margin: 6px 0 10px; }
  .mapkey span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-left: 8px; }
  .mapkey .k1 { background: #1f1f1e; margin-left: 0; } .mapkey .k2 { background: #b0b0ab; } .mapkey .k3 { background: #2a78d6; }
  table.areagrid { border-collapse: separate; border-spacing: 4px; width: 100%; max-width: 640px; }
  td.areacell { text-align: left; vertical-align: top; padding: 6px 8px; border-radius: 4px; font-size: 12px; white-space: normal; }
  td.areacell.corner { background: #d9cfb6; } td.areacell.side { background: #e6dec9; } td.areacell.center { background: #efe9db; }
  td.areacell .an { font-weight: 600; color: var(--ink-2); margin-bottom: 2px; text-transform: capitalize; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { background: var(--band); border-radius: 4px; padding: 6px 10px; min-width: 110px; }
  .stat .sv { font-size: 16px; font-weight: 600; } .stat .sl { font-size: 11px; color: var(--ink); }
  h3.sub { font-size: 14px; margin: 18px 0 8px; }
  .gamegrid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 8px; }
  /* Game page (2026-11-27 redesign): player cards, a large board on the left, one tabbed analysis panel on the right */
  .pcards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 14px; }
  .pcard { background: var(--panel); border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; }
  .pcard .who { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .pcard .stone, .perfcard .stone { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #444; flex: none; }
  .pcard .perf { font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -0.3px; }
  .pcard .perf small { font-size: 14px; font-weight: 500; color: var(--ink); }
  .pcard .perflabel { font-size: 12px; color: var(--ink); }
  #perftable .card { margin-bottom: 12px; }
  .perfcard .gtabs { align-items: center; }
  .perfcard .gtabs .perfrange { margin-left: auto; color: var(--muted); font-size: 12px; }
  .perfcard table { width: 100%; }
  .perfcard .who { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .perfcard .pm { color: var(--muted); font-size: 12px; font-weight: 400; }
  .pcard .note { font-size: 12px; color: #9a5b12; margin-top: 2px; min-height: 16px; }
  .pcard .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .pcard .kpi .v { font-size: 17px; font-weight: 600; }
  .pcard .kpi .l { font-size: 11px; color: var(--ink); }
  .pnote { font-size: 12px; margin-top: 2px; }
  .colbtn { font: inherit; padding: 4px 10px; border: 1px solid var(--grid); border-radius: 4px; background: var(--panel); cursor: pointer; }
  #coldlg { max-width: 560px; border: 1px solid #bbb; border-radius: 8px; padding: 16px 20px; color: #111; font-size: 13.5px; }
  #coldlg::backdrop { background: rgba(0, 0, 0, 0.25); }
  #coldlg h3 { margin: 0 0 8px; font-size: 16px; }
  #coldlg fieldset { border: 0; border-top: 1px solid var(--grid); margin: 8px 0 0; padding: 6px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  #coldlg legend { font-weight: 700; padding: 0 4px 0 0; }
  #coldlg label { display: flex; gap: 6px; align-items: center; }
  .curvegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .curvecard h3 { margin: 0 0 2px; font-size: 14px; } .curvecard .wt { font-weight: 400; font-size: 12px; }
  .curvecard .unit { font-size: 12px; color: var(--ink); margin-bottom: 4px; }
  .curvelegend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; margin: 6px 0 4px; align-items: center; }
  @media (max-width: 1100px) { .curvegrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .helpbtn { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #555; background: #fff; color: #111; font: 700 12px/18px system-ui, sans-serif; padding: 0; cursor: pointer; vertical-align: middle; margin-left: 6px; }
  .helpbtn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  #helpdlg { max-width: 520px; border: 1px solid #bbb; border-radius: 8px; padding: 16px 20px; color: #111; font-size: 13.5px; line-height: 1.5; }
  #helpdlg::backdrop { background: rgba(0, 0, 0, 0.25); }
  #helpdlg h3 { margin: 0 0 10px; font-size: 16px; }
  #helpdlg button { padding: 5px 14px; }
  .helpdl dt { font-weight: 700; margin-top: 8px; } .helpdl dd { margin: 2px 0 0 0; }
  .gapnote { font-size: 13px; padding: 8px 12px; border-left: 3px solid #b5541f; background: #fbf3ec; margin: 0 0 12px; }
  .movestrip { margin-bottom: 12px; padding: 10px 14px; }
  .movestrip .mhead { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
  .movestrip .mcells { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
  .movestrip .mv { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movestrip .ml { font-size: 11px; color: var(--ink); }
  .movestrip .mnote { font-size: 12px; margin-top: 6px; }
  @media (max-width: 1100px) { .movestrip .mcells { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .stats.onerow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .stats.onerow > * { min-width: 0; margin: 0; }
  .gv { display: grid; grid-template-columns: minmax(420px, 1.05fr) minmax(420px, 1fr); gap: 16px; align-items: start; }
  .gv-board { position: sticky; top: 8px; }
  .gv-panel { min-height: 400px; }
  .gtabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--grid); margin: -4px -4px 10px; padding: 0 4px; }
  .gtabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; }
  .gtabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
  .probs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .method { max-width: 920px; line-height: 1.55; color: var(--ink); }
  .method h2 { margin-top: 4px; } .method h3 { margin: 26px 0 8px; font-size: 16px; }
  .method .lead { font-size: 15px; }
  .method ol, .method ul { padding-left: 22px; } .method li { margin: 4px 0; }
  table.mdef { width: 100%; border-collapse: collapse; }
  table.mdef th { text-align: left; vertical-align: top; width: 230px; padding: 7px 12px 7px 0; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--grid); font-size: 13px; }
  table.mdef td { padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 13px; text-align: left; white-space: normal; }
  table.mdef th { white-space: normal; }
  tr.cur td { background: #dbe9fb; font-weight: 600; }
  table.sortable th { cursor: pointer; user-select: none; }
  table.sortable th:hover { color: var(--accent); }
  table.sortable th[data-sorted]::after { content: " " attr(data-sorted); font-size: 10px; }
  .probs table td, .probs table th { padding: 4px 6px; }
  @media (max-width: 1100px) { .gv, .pcards, .probs { grid-template-columns: 1fr; } .gv-board { position: static; } }
  #gametable { overflow-x: auto; }
  #gametable td.l:first-child { max-width: 300px; white-space: normal; }
  .cellnote { font-size: 11px; color: #9a5b12; font-weight: 400; margin-top: 2px; }
  body { margin: 0; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--surface); }
  header { padding: 18px 24px 0; }
  h1 { margin: 0; font-size: 22px; }
  .sub { color: var(--ink); font-size: 13px; margin-top: 2px; }
  nav { display: flex; gap: 4px; padding: 14px 24px 0; border-bottom: 1px solid var(--grid); }
  nav button { border: 0; background: none; padding: 8px 14px; font: inherit; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 16px 24px 40px; }
  h2 { font-size: 16px; margin: 22px 0 8px; }
  table { border-collapse: collapse; background: var(--panel); }
  th, td { padding: 4px 10px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; vertical-align: bottom; border-bottom: 1px solid var(--grid); }
  td.l, th.l { text-align: left; }
  tr.first td { font-weight: 600; }
  tr.shade td { background: var(--band); }
  tr.thin td { color: var(--muted); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #e8f0fb; }
  .legend-note { color: var(--muted); font-size: 12px; max-width: 1100px; margin-top: 8px; }
  details.howto { margin: 14px 0 6px; max-width: 1100px; font-size: 12.5px; }
  details.howto summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
  details.howto h3 { font-size: 13px; margin: 14px 0 4px; color: var(--ink); background: none; padding: 0; text-align: left; }
  details.howto table { margin: 0; }
  details.howto td { white-space: normal; text-align: left; vertical-align: top; padding: 4px 10px; }
  details.howto td.k { white-space: nowrap; font-weight: 600; color: var(--ink); width: 1%; }
  details.howto p, details.howto li { color: var(--ink-2); margin: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
  .card { background: var(--panel); border: 1px solid var(--grid); border-radius: 6px; padding: 10px 12px; }
  .card h3 { margin: 0 0 2px; font-size: 13px; }
  .card .unit { color: var(--muted); font-size: 11px; }
  .keys { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); margin: 6px 0 0; flex-wrap: wrap; }
  .keys span::before { content: ""; display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .filters select, .filters input { font: inherit; padding: 4px 8px; border: 1px solid var(--grid); border-radius: 4px; background: var(--panel); }
  .tip { position: fixed; pointer-events: none; background: #1f1f1e; color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 4px; z-index: 10; display: none; white-space: nowrap; }
  .back { border: 1px solid var(--grid); background: var(--panel); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .muted { color: var(--muted); }
  svg text { font: 11px system-ui, sans-serif; fill: var(--ink); }   /* black chart text (the user's call) */
  svg .lbl { fill: var(--ink); }
  .scroll { overflow-x: auto; }
  /* Moves list: 10 rows visible, the rest scroll; the column labels stay in view (sticky header). */
  .movescroll { overflow: auto; border-bottom: 1px solid var(--grid); }
  .movescroll th { position: sticky; top: 0; z-index: 1; background: var(--surface); }
  /* Phones (the user, 2026-11-27): one column, no fixed minimum width; charts keep a readable size and scroll
     sideways instead of shrinking their text; tables scroll; form controls at 16 px so phones do not zoom in. */
  @media (max-width: 760px) {
    .wrap { min-width: 0; }
    html { overflow-x: hidden; }
    header { padding: 12px 12px 0; }
    h1 { font-size: 19px; }
    main { padding: 10px 10px 32px; }
    nav { padding: 8px 8px 0; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    nav button { padding: 8px 10px; white-space: nowrap; flex: none; }
    .filters { gap: 6px 8px; }
    .filters select, .filters input { font-size: 16px; max-width: 100%; }
    .filters input { flex: 1 1 140px; min-width: 0; }
    .gv, .pcards, .probs, .grid, .maps, .gamegrid, .curvegrid { grid-template-columns: 1fr !important; }
    .pcard .kpis { grid-template-columns: repeat(2, 1fr); }
    .movestrip { padding: 8px 10px; }
    .movestrip .mhead { flex-direction: column; gap: 2px; }
    .movestrip .mcells { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats.onerow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .gtabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .gtabs button { white-space: nowrap; flex: none; }
    .chart, #gpanel { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .chart svg.full, #gpanel svg.full { min-width: 560px; }
    .scroll, .movescroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { font-size: 12px; }
    table.mdef th, table.mdef td { display: block; width: auto; padding: 4px 0; border-bottom: 0; }
    table.mdef tr { display: block; border-bottom: 1px solid var(--grid); padding: 6px 0; }
    .method { font-size: 14px; }
    #helpdlg { max-width: 92vw; padding: 12px 14px; }
    .card { padding: 10px; }
    main h2, main h3 { overflow-wrap: anywhere; }
    .gv > *, .pcards > *, .probs > *, .grid > *, .maps > *, .wheregrid > *, .card { min-width: 0; max-width: 100%; }
    #boardbox > div:first-child { flex-wrap: nowrap; }
    #boardbox .back { padding: 4px 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Rank Estimate Training</h1>
  <div class="sub" id="stamp"></div>
</header>
<nav>
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="ranks">Ranks</button>
  <button data-tab="games">Games</button>
  <button data-tab="curves">Rank curves</button>
  <button data-tab="method">Data</button>
</nav>
<main id="main"></main>
<dialog id="coldlg"><form method="dialog"><h3>Columns</h3><div class="colbody"></div>
  <div style="display:flex;justify-content:space-between;margin-top:10px"><button type="button" id="colreset">Defaults</button>
  <span><button value="cancel">Cancel</button> <button value="ok">Show</button></span></div></form></dialog>
<dialog id="helpdlg"><form method="dialog"><h3></h3><div class="helpbody"></div><div style="text-align:right"><button>Close</button></div></form></dialog>
</div>
<div class="tip" id="tip"></div>
<script>const DATA_VERSION = "20261127142239";   // push_site.py stamps each publish, so browsers never keep an older copy of the data</script>
<script src="data/summary.js?v=20261127142239"></script>
<script src="data/rank_graph.js?v=20261127142239"></script>
<script>
"use strict";
// Names fixed by the user (GoRanks/CLAUDE.md): phases and columns, in this order.
const PHASES = ["overall", "opening", "middle", "end"];
const PHASE_NAMES = { overall: "Overall", opening: "Opening", middle: "Middle", end: "Endgame" };
const COLUMNS = [
  ["games", "Games Analyzed"], ["moves", "Moves Analyzed"], ["top1", "Best Move %"], ["accuracy", "Accuracy"], ["match_pct", "Match %"],
  ["mean_loss", "Avg Point Loss"], ["critical_top1", "Key Moment Top Move %"],
  ["difficulty_9d", "Game Difficulty (9d) %"], ["hard_positions", "Tough Spots (per game)"],
  ["hard_found_pct", "Key Move Found % (per game)"], ["engine_like_pct", "Engine Likeness %"],
  // per-game measures, averaged over the rank's / band's games (the user, 2026-11-27; Overall rows only)
  ["x_move_quality_raw", "Move Quality"],
  ["x_score_swing", "Score Swing"], ["x_lead_changes", "Lead Changes"], ["x_steadiness", "Steadiness"], ["x_max_loss", "Biggest Loss"],
  ["x_pl_0", "< 0.5 pts"], ["x_pl_1", "0.5–2 pts"], ["x_pl_2", "2–5 pts"], ["x_pl_3", "5–10 pts"], ["x_pl_4", "10+ pts"],
  ["x_wl_0", "< 2 %"], ["x_wl_1", "2–5 %"], ["x_wl_2", "5–10 %"], ["x_wl_3", "10–20 %"], ["x_wl_4", "20 %+"],
  // the second model's rank for the game (the user, 2026-11-27): V4, the neural network; V3 is the Performance Rank
  ["x_rank_v4", "V4nn"],
];
// Column chooser (the user, 2026-11-27): the tables show the original columns by default; the new measures appear when
// ticked in the "Columns" pop-up. The choice is remembered in this browser.
// the user's defaults (2026-11-27): Games Analyzed, Best Move %, Accuracy, Match %, Avg Point Loss, Game Difficulty
const DEFAULT_COLS = ["games", "top1", "accuracy", "match_pct", "mean_loss", "difficulty_9d"];
const COL_GROUPS = [["Main measures", ["games", "moves", "top1", "accuracy", "match_pct", "mean_loss", "critical_top1", "difficulty_9d",
  "hard_positions", "hard_found_pct", "engine_like_pct"]], ["Move quality and volatility", ["x_move_quality_raw", "x_score_swing", "x_lead_changes", "x_steadiness", "x_max_loss"]],
  ["Point-loss classes", ["x_pl_0", "x_pl_1", "x_pl_2", "x_pl_3", "x_pl_4"]], ["Win-rate loss classes", ["x_wl_0", "x_wl_1", "x_wl_2", "x_wl_3", "x_wl_4"]],
  ["Rank models", ["x_rank_v4"]]];
let shownCols = (() => { try { const v = JSON.parse(localStorage.getItem("gr_cols")); return Array.isArray(v) && v.length ? v : DEFAULT_COLS; } catch (e) { return DEFAULT_COLS; } })();
const visibleCols = () => COLUMNS.filter(([k]) => shownCols.includes(k));
const columnsButton = () => `<button class="colbtn" id="colbtn">Columns…</button>`;
function openColumns(redraw) {
  const name = Object.fromEntries(COLUMNS);
  const dlg = document.getElementById("coldlg");
  dlg.querySelector(".colbody").innerHTML = COL_GROUPS.map(([title, keys]) => `<fieldset><legend>${title}</legend>` +
    keys.map(k => `<label><input type="checkbox" value="${k}" ${shownCols.includes(k) ? "checked" : ""}> ${esc(name[k])}</label>`).join("") + `</fieldset>`).join("");
  dlg.querySelector("#colreset").onclick = () => dlg.querySelectorAll("input").forEach(i => i.checked = DEFAULT_COLS.includes(i.value));
  dlg.onclose = () => {
    if (dlg.returnValue !== "ok") return;
    shownCols = [...dlg.querySelectorAll("input:checked")].map(i => i.value);
    if (!shownCols.length) shownCols = DEFAULT_COLS;
    try { localStorage.setItem("gr_cols", JSON.stringify(shownCols)); } catch (e) {}
    redraw();
  };
  dlg.returnValue = "";
  dlg.showModal();
}
// the per-game measures that band and rank rows average from their games (Overall rows)
const GAME_AVG = ["x_move_quality_raw", "x_score_swing", "x_lead_changes", "x_steadiness", "x_max_loss",
  "x_pl_0", "x_pl_1", "x_pl_2", "x_pl_3", "x_pl_4", "x_wl_0", "x_wl_1", "x_wl_2", "x_wl_3", "x_wl_4", "x_rank_v4"];
const POS_COLUMNS = [["same_area_pct", "Same Area %"], ["direction_err_per100", "Direction Errors %"],
  ["local_err_per100", "Local Errors %"], ["resolved_pct", "Resolved-Area Play %"], ["low_value_pct", "Lower-Value Area %"],
  ["forced_error_pct", "Forced Error %"], ["forcing_induced_pct", "Forcing Success %"],
  ["same_shape_pct", "Same Shape %"], ["bad_shape_pct", "Empty Triangle %"]];
const BANDS = ["K1", "K2", "K3", "K4", "K5", "D1-3", "D4-6", "D7-9", "Pro"];
const WRAP = { "Games Analyzed": "Games<br>Analyzed", "Moves Analyzed": "Moves<br>Analyzed", "Best Move %": "Best<br>Move %",
  "Avg Point Loss": "Avg Point<br>Loss", "Key Moment Top Move %": "Key Moment<br>Top Move %",
  "Game Difficulty (9d) %": "Game Difficulty<br>(9d) %", "Tough Spots (per game)": "Tough Spots<br>(per game)", "Key Move Found % (per game)": "Key Move Found %<br>(per game)",
  "Engine Likeness %": "Engine<br>Likeness %", "AI-like span (moves)": "AI-like span<br>(moves)" };
const head = t => WRAP[t] || esc(t);
const MIN_MOVES = 50;
const CHARTS = [   // [column, title, unit, transform]
  ["top1", "Best Move %", "% of moves", v => 100 * v],
  ["mean_loss", "Avg Point Loss", "points per move", v => v],
  ["critical_top1", "Key Moment Top Move %", "% of key moments", v => 100 * v],
  ["difficulty_9d", "Game Difficulty (9d) %", "a 9d's error rate, %", v => v],
  ["hard_found_pct", "Key Move Found % (per game)", "average per-game % of Tough Spots (from 5 Tough Spots on)", v => v],

function fmt(col, v) {
  if (v === null || v === undefined || v === "") return "–";

}

function groupedTable(groups, firstHeader, cols, opts = {}) {
  // groups: [{label, rows: {phase: row}, onclick?}]
  let h = `<div class="scroll"><table><tr><th class="l">${firstHeader}</th><th class="l">Phase</th>` +
          cols.map(c => `<th>${head(c[1])}</th>`).join("") + "</tr>";
  groups.forEach((g, gi) => {
    PHASES.forEach(ph => {
      const r = g.rows[ph];
      if (!r) return;
      const cls = [gi % 2 === 0 ? "shade" : "", ph === "overall" ? "first" : "",
                   opts.muteThin !== false && r.moves < MIN_MOVES ? "thin" : "", g.click ? "click" : ""].join(" ");
      h += `<tr class="${cls}" ${g.click ? `data-go="${esc(g.click)}"` : ""}><td class="l">${ph === "overall" ? esc(g.label) + (g.sub ? `<div class="cellnote">${esc(g.sub)}</div>` : "") : ""}</td>` +
           `<td class="l">${PHASE_NAMES[ph]}</td>` + cols.map(c => `<td>${esc(fmt(c[0], r[c[0]]))}</td>`).join("") + "</tr>";
    });
  });
  return h + "</table></div>";
}

function levelGroups(level, key, order) {
  const out = [];
  order.forEach(k => {
    const byPhase = {};
    rows.filter(r => r.level === level && r[key] === k).forEach(r => byPhase[r.phase] = r);
    if (Object.keys(byPhase).length) out.push({ label: k, rows: byPhase });
  });
  return out;
}

// ---- charts (SVG, with hover) --------------------------------------------------------------------
function lineChart(title, unit, xs, series, opts = {}) {
  // series: [{name, color, points: [{x index, y, thin, tip}]}]
  const W = 400, H = 220, L = 44, R = 70, T = 14, B = 36;
  const all = series.flatMap(s => s.points.map(p => p.y)).filter(v => v !== null);
  if (!all.length) return "";
  let lo = Math.min(0, ...all), hi = Math.max(...all);
  if (hi === lo) hi = lo + 1;
  hi += (hi - lo) * 0.08;
  const x = i => L + (xs.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (xs.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">`;
  const ticks = 4;
  for (let k = 0; k <= ticks; k++) {
    const v = lo + (hi - lo) * k / ticks, yy = y(v);
    s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${css("--grid")}"/>` +
         `<text x="${L - 6}" y="${yy + 4}" text-anchor="end">${+v.toFixed(v < 10 ? 1 : 0)}</text>`;
  }
  const every = Math.ceil(xs.length / 16);
  xs.forEach((lab, i) => { if (i % every === 0) s += `<text x="${x(i)}" y="${H - B + 16}" text-anchor="middle">${esc(lab)}</text>`; });
  const ends = [];
  series.forEach(se => {
    const pts = se.points.filter(p => p.y !== null);
    if (!pts.length) return;
    s += `<polyline fill="none" stroke="${se.color}" stroke-width="2" points="${pts.map(p => `${x(p.x)},${y(p.y)}`).join(" ")}"/>`;
    pts.forEach(p => {
      s += `<circle cx="${x(p.x)}" cy="${y(p.y)}" r="4" fill="${p.thin ? "#fff" : se.color}" stroke="${p.thin ? se.color : "#fff"}" stroke-width="${p.thin ? 1.6 : 1.2}"/>` +
           `<circle cx="${x(p.x)}" cy="${y(p.y)}" r="11" fill="transparent" data-tip="${esc(p.tip)}"/>`;
    });
    ends.push([se.name, x(pts[pts.length - 1].x), y(pts[pts.length - 1].y)]);
  });
  ends.sort((a, b) => a[2] - b[2]);
  for (let i = 1; i < ends.length; i++) if (ends[i][2] - ends[i - 1][2] < 12) ends[i][2] = ends[i - 1][2] + 12;
  ends.forEach(([n, ex, ey]) => s += `<text class="lbl" x="${ex + 8}" y="${ey + 4}">${esc(n)}</text>`);
  s += "</svg>";
  return `<div class="card"><h3>${esc(title)}</h3><div class="unit">${esc(unit)}</div>${s}</div>`;
}

function phaseCharts(level, key, order) {
  const keys = `<div class="keys">${PHASES.map(p => `<span style="--c:${COLOR[p]}">${PHASE_NAMES[p]}</span>`).join("")}</div>`;
  const cards = CHARTS.map(([col, title, unit, tf]) => lineChart(title, unit, order, PHASES.map(ph => ({
    name: PHASE_NAMES[ph], color: COLOR[ph],
    points: order.map((k, i) => {
      const r = rows.find(r => r.level === level && r[key] === k && r.phase === ph);
      let v = r ? r[col] : null;
      if (col === "hard_found_pct" && r && (r.hard_total ?? r.hard_positions) < 5) v = null;
      v = v === null || v === undefined || v === "" ? null : tf(+v);
      return { x: i, y: v, thin: r && r.moves < MIN_MOVES,
               tip: r ? `${k} · ${PHASE_NAMES[ph]}: ${fmt(col, r[col])} (${r.moves} moves, ${r.player_games} games)` : "" };
    }),
  })))).join("");
  return keys + `<div class="grid">${cards}</div>`;
}

const GAME_COLS = COLUMNS.slice(1).concat([["ai_like_span", "AI-like span (moves)"]]);
const COLOR_NAMES = { B: "Black", W: "White" };
const SIDE = { B: "#1f1f1e", W: "#9a9a96" };   // series colour per player in the game graphs
let gameFilter = { band: "", rank: "", q: "", handicap: "" };
// The games list shows GAME_PAGE games at a time (thousands of rows at once made the page lag); a click on a column
// header sorts the whole list, not only the rows on screen.
const GAME_PAGE = 300;
let gameShown = GAME_PAGE, gameSort = null;   // gameSort: { col, desc }

function gameIndex() {   // id -> {file, players: {B: {phase: row}, W: {...}}}
  const out = {};
  rows.filter(r => r.level === "game").forEach(r => {
    const g = out[r.id] = out[r.id] || { id: r.id, file: r.file, players: {} };
    (g.players[r.color] = g.players[r.color] || {})[r.phase] = r;
  });
  return out;
}
// HA[1] with komi 0 (Black first, no komi: a one-stone handicap) was shown as "Even" until 2026-11-27; the export
// keeps HA >= 2 only, so the komi tells them apart
const noKomi = r => r && !(r.handicap >= 2) && r.komi !== "" && r.komi != null && parseFloat(r.komi) === 0;
const handicapKind = r => r && r.handicap >= 2 ? "hc" : noKomi(r) ? "nokomi" : "even";
const handicapLabel = r => r && r.handicap >= 2 ? `Handicap ${r.handicap}` : noKomi(r) ? "No komi" : "Even";
// A negative loss: the position looked better for the player after the move than KataGo's shallow search estimated
// before it (search depth / noise). Shown as a gain; averages count it as 0, error logic never counts it.
const lossText = v => v === null || v === undefined ? "–" : v < 0 ? `${(+v).toFixed(2)} (gain)` : (+v).toFixed(2);
const playerInfo = (g, c) => {
  const r = (g.players[c] || {}).overall;
  // KGS / OGS: the server's own rank and its Fox equivalent (the tables group players by the Fox rank)
  if (r) return `${r.player || COLOR_NAMES[c]} (${r.rank_orig ? `~ Fox ${r.rank}` : r.rank})`;   // a KGS / OGS player: the Fox equivalent only (the user, 2026-11-27)
  const o = (g.players[c === "B" ? "W" : "B"] || {}).overall;   // a player without a usable rank: name from the game
  return o && o.opponent ? `${o.opponent} (unranked)` : "–";
};

function games() {
  const idx = gameIndex();
  const list0 = Object.values(idx).filter(g => g.players.B || g.players.W);
  const any = g => (g.players.B || g.players.W).overall || {};
  const bands = BANDS.filter(b => list0.some(g => ["B", "W"].some(c => g.players[c] && g.players[c].overall && g.players[c].overall.band === b)));
  const ranksL = [...new Set(rows.filter(r => r.level === "game").map(r => r.rank))].sort((a, b) => rankValue(a) - rankValue(b));
  const has = (g, f) => ["B", "W"].some(c => g.players[c] && g.players[c].overall && f(g.players[c].overall));
  const list = list0
    .filter(g => !gameFilter.band || has(g, r => r.band === gameFilter.band))
    .filter(g => !gameFilter.rank || has(g, r => r.rank === gameFilter.rank))
    .filter(g => !gameFilter.handicap || gameFilter.handicap === handicapKind(any(g)))
    .filter(g => !gameFilter.q || (g.file + " " + playerInfo(g, "B") + " " + playerInfo(g, "W")).toLowerCase().includes(gameFilter.q.toLowerCase()))
    .sort((a, b) => (!!any(b).external - !!any(a).external)   // tournament games (Albert's KPMC) first
      || (any(b).date || "").localeCompare(any(a).date || "") || a.file.localeCompare(b.file));   // then newest first
  let h = `<div class="filters">Rank band <select id="fb"><option value="">all</option>${bands.map(b => `<option ${b === gameFilter.band ? "selected" : ""}>${b}</option>`).join("")}</select>
    ${eraOptions()}
    Rank <select id="fr"><option value="">all</option>${ranksL.map(b => `<option ${b === gameFilter.rank ? "selected" : ""}>${b}</option>`).join("")}</select>
    Handicap <select id="fh"><option value="">all</option><option value="even" ${gameFilter.handicap === "even" ? "selected" : ""}>Even</option><option value="nokomi" ${gameFilter.handicap === "nokomi" ? "selected" : ""}>No komi</option><option value="hc" ${gameFilter.handicap === "hc" ? "selected" : ""}>Handicap</option></select>
    Search <input id="fq" placeholder="game or player" value="${esc(gameFilter.q)}"> <span class="muted">${list.length} games — click one to open it</span></div>`;
  const side = (g, c, k) => { const r = (g.players[c] || {}).overall; return r ? fmt(k, r[k]) : "–"; };
  const num = (g, c, k) => { const r = (g.players[c] || {}).overall; return r && r[k] != null && r[k] !== "" ? +r[k] : null; };
  const SORT_KEYS = [g => g.file, g => any(g).date || "", g => playerInfo(g, "B"), g => playerInfo(g, "W"), g => handicapLabel(any(g)),
    g => num(g, "B", "performance"), g => num(g, "W", "performance"), g => num(g, "B", "x_rank_v4"), g => num(g, "B", "top1"),
    g => num(g, "B", "mean_loss"), g => num(g, "B", "difficulty_9d"), g => num(g, "B", "engine_like_pct"), null];
  if (gameSort && SORT_KEYS[gameSort.col]) {
    const key = SORT_KEYS[gameSort.col];
    list.sort((a, b) => {
      const x = key(a), y = key(b);
      if (x === null || y === null) return x === null ? (y === null ? 0 : 1) : -1;   // games without a value last
      const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y));
      return gameSort.desc ? -r : r;
    });
  }
  h = h.replace("games — click one to open it", `games`);
  h += `<div class="scroll"><table class="sortable" id="gamelist"><tr><th class="l">Game</th><th class="l">Date</th><th class="l">Black</th><th class="l">White</th><th class="l">Handicap</th>` +
       `<th>V3<br>Black</th><th>V3<br>White</th><th>V4nn<br>B · W</th><th>Best Move %<br>B · W</th><th>Avg Point Loss<br>B · W</th><th>Game Difficulty (9d) %<br>B · W</th><th>Engine Likeness %<br>B · W</th><th class="l">Note</th></tr>`;
  list.slice(0, gameShown).forEach((g, i) => {

    ? `<p class="muted">${gameShown} / ${list.length} <button class="colbtn" id="moregames">More</button> <button class="colbtn" id="allgames">All</button></p>` : "");
  const again = () => { gameShown = GAME_PAGE; games(); };   // a new selection starts at the top of the list
  document.getElementById("fb").onchange = e => { gameFilter.band = e.target.value; again(); };

  document.getElementById("fr").onchange = e => { gameFilter.rank = e.target.value; again(); };

  document.getElementById("fq").oninput = e => { gameFilter.q = e.target.value; again(); const f = document.getElementById("fq"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); };
  const more = document.getElementById("moregames"), all = document.getElementById("allgames");

  if (all) all.onclick = () => { gameShown = list.length; games(); };
  const headRow = document.querySelector("#gamelist tr");
  [...headRow.children].forEach((th, i) => {
    if (gameSort && gameSort.col === i) th.setAttribute("data-sorted", gameSort.desc ? "▼" : "▲");
    th.onclick = e => {   // the whole list is sorted and drawn again (the page-wide sorter only knows the rows shown)

  });
}

function loadGame(id, then) {
  if (window.GR_GAMES && window.GR_GAMES[id]) return then(window.GR_GAMES[id]);
  if (location.protocol.startsWith("http") && window.DecompressionStream) {   // the website: gzipped game files
    fetch(`data/games/${encodeURIComponent(id)}.js.gz?v=${DATA_VERSION}`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(buf => { const b = new Uint8Array(buf);   // still gzip unless the server already unpacked it
        return b[0] === 0x1f && b[1] === 0x8b ? new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text() : new TextDecoder().decode(b); })
      .then(text => { const s = document.createElement("script"); s.textContent = text; document.head.appendChild(s); then((window.GR_GAMES || {})[id] || null); })
      .catch(() => then(null));
    return;
  }
  const s = document.createElement("script");
  s.src = `data/games/${encodeURIComponent(id)}.js?v=${DATA_VERSION}`;
  s.onload = () => then((window.GR_GAMES || {})[id] || null);
  s.onerror = () => then(null);
  document.head.appendChild(s);
}

// ---- board ------------------------------------------------------------------------------------------
const COLS_GTP = "ABCDEFGHJKLMNOPQRST";
function gtpXY(mv, size) { if (!mv || mv.toLowerCase() === "pass") return null; return [COLS_GTP.indexOf(mv[0].toUpperCase()), size - parseInt(mv.slice(1))]; }
function boardAt(board, n) {   // stones after the first n moves (captures applied)
  const size = board.size, st = new Map(), key = (x, y) => x + "," + y;
  const nb = (x, y) => [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < size && b < size);
  const group = (x, y) => { const c = st.get(key(x, y)), seen = new Set([key(x, y)]), todo = [[x, y]]; let libs = 0;
    while (todo.length) { const [a, b] = todo.pop(); nb(a, b).forEach(([p, q]) => { const k = key(p, q), v = st.get(k);
      if (!v) libs++; else if (v === c && !seen.has(k)) { seen.add(k); todo.push([p, q]); } }); }
    return { stones: [...seen], libs }; };
  (board.setup || []).forEach(([c, mv]) => { const p = gtpXY(mv, size); if (p) st.set(key(...p), c); });
  for (let i = 0; i < n && i < board.moves.length; i++) {
    const [c, mv] = board.moves[i], p = gtpXY(mv, size); if (!p) continue;
    st.set(key(...p), c);
    nb(...p).forEach(([a, b]) => { const v = st.get(key(a, b)); if (v && v !== c) { const g = group(a, b); if (!g.libs) g.stones.forEach(k => st.delete(k)); } });
    const own = group(...p); if (!own.libs) own.stones.forEach(k => st.delete(k));
  }

}
function boardSVG(board, n, marks) {   // the position after n moves; marks: {last, best, color, own}
  const size = board.size, c = 26, pad = 22, W = pad * 2 + c * (size - 1);
  let s = `<svg viewBox="0 0 ${W} ${W}" width="100%" role="img" aria-label="board"><rect width="${W}" height="${W}" fill="#e3c08a" rx="4"/>`;
  for (let i = 0; i < size; i++) {
    s += `<line x1="${pad}" x2="${pad + c * (size - 1)}" y1="${pad + c * i}" y2="${pad + c * i}" stroke="#5a4a32" stroke-width="0.8"/>` +
         `<line y1="${pad}" y2="${pad + c * (size - 1)}" x1="${pad + c * i}" x2="${pad + c * i}" stroke="#5a4a32" stroke-width="0.8"/>`;
  }
  (size === 19 ? [3, 9, 15] : []).forEach(a => [3, 9, 15].forEach(b => s += `<circle cx="${pad + c * a}" cy="${pad + c * b}" r="3" fill="#5a4a32"/>`));
  if (marks && marks.own) {   // KataGo's ownership of this position: black / white squares, stronger = more certain
    for (let i = 0; i < size * size && i < marks.own.length; i++) {
      const v = (marks.own.charCodeAt(i) - 97) * 10 - 100, a = Math.abs(v) / 100;
      if (a < 0.15) continue;
      const x = i % size, y = Math.floor(i / size);
      s += `<rect x="${pad + c * x - c * 0.45}" y="${pad + c * y - c * 0.45}" width="${c * 0.9}" height="${c * 0.9}" fill="${v > 0 ? "#1f1f1e" : "#ffffff"}" fill-opacity="${(0.55 * a).toFixed(2)}"/>`;
    }
  }
  boardAt(board, n).forEach((col, k) => { const [x, y] = k.split(",").map(Number);
    s += `<circle cx="${pad + c * x}" cy="${pad + c * y}" r="${c * 0.47}" fill="${col === "B" ? "#1f1f1e" : "#f7f7f4"}" stroke="#333" stroke-width="${col === "B" ? 0 : 0.8}"/>`; });
  // The user's scheme (2026-11-27): filled discs, no rings — blue = KataGo's Best Move for the move to play, green =
  // the other moves the player could have chosen (marks.good: 20 %+ of the best move's visits, the Match % rule); a
  // small dot in the mover's colour = the move actually played next; a small contrasting dot on the last stone played.
  const disc = (mv, fill) => { const p = gtpXY(mv, size); if (p) s += `<circle cx="${pad + c * p[0]}" cy="${pad + c * p[1]}" r="${c * 0.4}" fill="${fill}" stroke="#ffffff" stroke-width="1"/>`; };
  if (marks && marks.good) marks.good.split(" ").filter(Boolean).forEach(mv => disc(mv, "#2e9e5b"));
  if (marks && marks.best) disc(marks.best, "#2a78d6");
  if (marks && marks.next) {
    const p = gtpXY(marks.next, size);
    if (p) s += `<circle cx="${pad + c * p[0]}" cy="${pad + c * p[1]}" r="${c * 0.17}" fill="${marks.nextColor === "W" ? "#f7f7f4" : "#1f1f1e"}" stroke="${marks.nextColor === "W" ? "#1f1f1e" : "#f7f7f4"}" stroke-width="1.2"/>`;
  }
  if (marks && marks.last) {
    const p = gtpXY(marks.last, size);
    if (p) s += `<circle cx="${pad + c * p[0]}" cy="${pad + c * p[1]}" r="${c * 0.13}" fill="${marks.color === "W" ? "#1f1f1e" : "#f7f7f4"}"/>`;
  }
  return s + "</svg>";
}

// ---- per-move graphs for both players -------------------------------------------------------------
function perMoveChart(title, unit, moves, key, opts) {
  // moves: {B: [...], W: [...]}; x = move number; a cursor line at the current move; click -> jump there.
  const W = 760, H = 170, L = 40, R = 12, T = 10, B = 24;
  const all = ["B", "W"].flatMap(c => moves[c].map(m => Object.assign({ color: c }, m))).filter(m => m[key] !== null && m[key] !== undefined);
  if (!all.length) return "";
  const xmax = Math.max(...all.map(m => m.move)), xmin = 1;
  const tf = opts.tf || (v => v), hi = opts.max || Math.max(1, ...all.map(m => tf(m[key])));
  const x = v => L + (W - L - R) * (v - xmin) / Math.max(1, xmax - xmin), y = v => T + (H - T - B) * (1 - v / hi);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">`;
  [60, 150].forEach(b => { if (b < xmax) s += `<line x1="${x(b + 0.5)}" x2="${x(b + 0.5)}" y1="${T}" y2="${H - B}" stroke="${css("--grid")}" stroke-dasharray="4 3"/>`; });
  (opts.spans || []).forEach(([a, b, c]) => s += `<rect x="${x(a) - 3}" y="${T}" width="${Math.max(6, x(b) - x(a) + 6)}" height="${H - T - B}" fill="${c === "B" ? "#1f1f1e" : "#9a9a96"}" opacity="0.10"/>`);
  for (let k = 0; k <= 4; k++) { const v = hi * k / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--grid")}" opacity="0.6"/><text x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${+v.toFixed(hi < 5 ? 1 : 0)}</text>`; }
  for (let t = 20; t <= xmax; t += 20) s += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${t}</text>`;
  const bw = Math.max(1.5, (W - L - R) / (xmax - xmin + 1) - 1);
  ["B", "W"].forEach(c => {
    const pts = all.filter(m => m.color === c);
    if (opts.bars) pts.forEach(m => { const v = Math.min(hi, Math.max(0, tf(m[key])));
      s += `<rect x="${x(m.move) - bw / 2}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" fill="${SIDE[c]}" opacity="${m.decided ? 0.3 : 1}"/>`; });
    else {   // a gap in the data stays a gap: a new line segment wherever moves of this player are missing
      let seg = [];
      const flush = () => { if (seg.length > 1) s += `<polyline fill="none" stroke="${SIDE[c]}" stroke-width="1.8" points="${seg.join(" ")}"/>`;
        else if (seg.length === 1) { const [px, py] = seg[0].split(","); s += `<circle cx="${px}" cy="${py}" r="1.8" fill="${SIDE[c]}"/>`; } seg = []; };
      pts.forEach((m, i) => { if (i && m.move - pts[i - 1].move > 2) flush(); seg.push(`${x(m.move)},${y(Math.min(hi, tf(m[key])))}`); });
      flush();
    }
    if (opts.mark) pts.filter(opts.mark).forEach(m => s += `<circle cx="${x(m.move)}" cy="${y(Math.min(hi, tf(m[key])))}" r="4" fill="#eb6834" stroke="#fff" stroke-width="1"/>`);
    pts.forEach(m => s += `<rect x="${x(m.move) - bw / 2 - 1}" y="${T}" width="${bw + 2}" height="${H - T - B}" fill="transparent" data-move="${m.move}" data-tip="${esc(opts.tip(m))}" style="cursor:pointer"/>`);
  });
  if (opts.cursor) s += `<line x1="${x(opts.cursor)}" x2="${x(opts.cursor)}" y1="${T}" y2="${H - B}" stroke="#2a78d6" stroke-width="1.5"/>`;
  return `<div class="card" style="margin-bottom:10px"><h3>${esc(title)}</h3><div class="unit">${esc(unit)}</div>${s}</div>`;

// Help: a "?" button beside a title opens one shared dialog with the explanation (Zhangqi-style ⓘ tips), so the

// ---- game timeline, after Zhangqi's 吻合度 chart (the user's screenshots, 2026-11-27) ----------------------------
// Per player: a Best move lane (a mark on every move that was KataGo's first choice), a Good move lane (a mark on every
// move with 20 %+ of the best move's visits, the Match % rule) carrying the highlights — runs of good play (at least
// HL_MIN of the player's moves, at least HL_SHARE of them good, never two misses in a row), each labelled with the
// level the player played at over it (the mean of the per-move levels: the Performance Rank model on the 12 moves
// around each move) — then Key moments (Tough Spots, found ● / missed ✕) and Engine-like (the AI-like spans).
// Marks join into bars where moves follow each other, as in Zhangqi's chart. Hover for details, click to go to a move.
// Highlights (the user's design, 2026-11-27): built on the move quality — each informative move's closest policy
// network (engine_rank.move_quality: 15k ... 9d, 12 = KataGo); moves every network would play carry none. A high-quality
// move is one closest to 9d or KataGo (HL_HIGH+). A highlight: at least HL_MIN informative moves, at least HL_SHARE of
// them high-quality, never two others in a row; labelled with the run's mean move quality. Runs at most HL_MERGE
// moves apart merge (move-weighted mean).
const HL_HIGH = 9, HL_BREAK = 5, HL_MIN = 6, HL_SHARE = 0.8, HL_MERGE = 2;   // a move below HL_BREAK (a real mistake) ends a run   // merge only runs that touch (one opponent move apart):
// wider merging chained separate runs into one long bar whose in-between moves pulled the label down (R3: 1-75 at 8.8)
const TL_MARK = { B: "#d65a5a", W: "#4f86cf" };   // the two players' identities (red / blue, as Zhangqi); text stays black
const TL_HIGHLIGHT = "#6cc04a";
function rankLabel(v) { const r = Math.round(v); return r >= 1 ? `${r}d` : `${1 - r}k`; }

function highlights(list, levels) {
  const ms = (levels || []).map(([move, q]) => ({ move, q: Math.max(-14, q) }));   // informative moves only
  const out = [];
  let run = [], low = 0;
  const high = m => m.q >= HL_HIGH;
  const close = () => {
    while (run.length && !high(run[run.length - 1])) { run.pop(); low--; }   // a run ends on a high-quality move
    if (run.length >= HL_MIN && (run.length - low) / run.length >= HL_SHARE)
      out.push({ a: run[0].move, b: run[run.length - 1].move, n: run.length, good: run.length - low,
                 level: run.reduce((x, m) => x + m.q, 0) / run.length });
    run = []; low = 0;
  };
  ms.forEach(m => {
    if (high(m)) { run.push(m); return; }
    const prevLow = run.length && !high(run[run.length - 1]);
    if (!run.length || m.q < HL_BREAK || prevLow || (run.length - low) / (run.length + 1) < HL_SHARE) { close(); return; }
    run.push(m); low++;
  });
  close();
  const merged = [];
  out.forEach(h => {
    const last = merged[merged.length - 1];
    if (last && h.a - last.b <= HL_MERGE) {
      last.level = (last.level * last.n + h.level * h.n) / (last.n + h.n);
      last.n += h.n; last.good += h.good; last.b = h.b; last.parts.push(h);
    } else merged.push(Object.assign({ parts: [h] }, h));
  });

}
function timelineChart(d) {

    const scored = list.filter(m => m.accuracy !== null && m.accuracy !== undefined && m.accuracy !== "");
    const pct = f => scored.length ? `${(100 * scored.filter(f).length / scored.length).toFixed(1)} %` : "–";
    const tough = list.filter(m => m.p_err_9d >= 0.5), found = tough.filter(m => m.loss !== null && m.loss < 2).length;
    s += `<text x="${W - R + 8}" y="${lane(0) + 14}" font-size="12" font-weight="600" fill="#111">${pct(isBest)}</text>`;
    s += `<text x="${W - R + 8}" y="${lane(1) + 14}" font-size="12" font-weight="600" fill="#111">${pct(isGood)}</text>`;
    s += `<text x="${W - R + 8}" y="${lane(2) + 14}" font-size="12" fill="#111">${found}/${tough.length} found</text>`;
  });
  for (let t = 20; t <= xmax; t += 20) s += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle" font-size="12" fill="#111">${t}</text>`;
  if (cur.move) s += `<line x1="${x(cur.move)}" x2="${x(cur.move)}" y1="${T - 4}" y2="${H - AX}" stroke="#2a78d6" stroke-width="1.5" pointer-events="none"/>`;
  const help = helpButton("Game timeline", `<dl class="helpdl">
    <dt>Best move</dt><dd>A mark on every move that was KataGo's first choice. The share is on the right.</dd>
    <dt>Good move</dt><dd>A mark on every move with at least 20 % of KataGo's best move's visits (the Match % rule). The share is on the right.</dd>
    <dt><span style="background:${TL_HIGHLIGHT};padding:0 5px;border-radius:3px">Highlights</span></dt><dd>Runs of high-quality moves. Each move's quality is the policy network its choice is closest to: a KataGo-Human rank profile (15k … 9d) or KataGo itself ("AI"); moves every network would play are not counted. A highlight has at least 6 such moves, 80 % or more of them at 9d or KataGo level; a move closest to a profile below 5d (a real mistake) ends it. It is labelled with the average quality of all its moves. Only runs that touch are joined. Opening runs can read high: memorised moves match KataGo.</dd>
    <dt>Key moments</dt><dd>Tough Spots (a 9d errs there half the time or more): <span style="color:#0aac23">●</span> the player found a good move, <span style="color:#dc3c3d">✕</span> missed it.</dd>
    <dt>Engine-like</dt><dd>Spans of consecutive moves with Engine Likeness over 50 %.</dd>
  </dl><p>Hover for details; click anywhere on a player's lanes to go to that move.</p>`);
  return `<div class="chart"><h3 class="sub">Game timeline ${help}</h3>${s}</svg></div>`;
}

function spansOf(list, color) {
  const out = []; let a = null, b = null;
  list.filter(m => m.counted === 1).forEach(m => {
    if (m.p_assisted > 0.5) { if (a === null) a = m.move; b = m.move; } else if (a !== null) { out.push([a, b, color]); a = null; }
  });
  if (a !== null) out.push([a, b, color]);
  return out;
}

// ---- Rank curves (v3, the rank graph; the user's design, 2026-11-27) ----------------------------------------------
// One chart per KataGo measure: for each declared rank, the median of that rank's games, per server; above 9d the
// curve runs on (dashed) to KataGo's own value at 12 = AI. The grade measures first (with their weight in the
// Performance Rank), then the curves shown for reference only. Colours: the site's categorical pair (KGS blue, OGS
// orange) plus both servers in dark grey, dashed; all text black.
// one line per phase (the user, 2026-11-27), in the site's phase colours; both servers together
const CURVE_SERIES = [["overall", "Overall", "#2a78d6", ""], ["opening", "Opening", "#eb6834", ""], ["middle", "Middle", "#1baf7a", ""], ["end", "Endgame", "#eda100", ""]];
const CURVE_FMT = {
  accuracy: v => v.toFixed(0), match_pct: v => v.toFixed(0) + " %", top1: v => Math.round(100 * v) + " %",
  mean_loss: v => v.toFixed(2), critical_top1: v => Math.round(100 * v) + " %", hard_found_pct: v => v.toFixed(0) + " %",
  move_quality: v => levelText(v), score_swing: v => v.toFixed(2), lead_changes: v => v.toFixed(1),
  steadiness: v => v.toFixed(2), max_loss: v => v.toFixed(1),
};
const curveFmt = k => CURVE_FMT[k] || (/^(pl|wl)_/.test(k) ? v => v.toFixed(1) : v => v.toFixed(2));
const CURVE_TIP = {
  pl_0: "moves per game losing this many points", pl_1: "moves per game losing this many points", pl_2: "moves per game losing this many points",
  pl_3: "moves per game losing this many points", pl_4: "moves per game losing this many points",
  wl_0: "moves per game losing this much win rate", wl_1: "moves per game losing this much win rate", wl_2: "moves per game losing this much win rate",
  wl_3: "moves per game losing this much win rate", wl_4: "moves per game losing this much win rate",
};
function curveChart(m, model) {
  const W = 360, H = 230, L = 52, R = 14, T = 14, B = 36;
  const ai = model.ai_level, X0 = -14, X1 = ai;
  const x = r => L + (W - L - R) * (r - X0) / (X1 - X0);
  const src = ph => ph === "overall" ? (model.curves[m.key] || {}).pooled : ((model.phase_curves || {})[ph] || {})[m.key]?.pooled;
  const series = CURVE_SERIES.map(([k, name, col, dash]) => ({ k, name, col, dash,
    pts: (src(k) || []).map(([r, v]) => [r, m.sign * v]) })).filter(sr => sr.pts.length);
  const anchor = m.sign * m.anchor;
  const showAI = !/^(pl|wl)_/.test(m.key);   // move counts per game: no meaningful AI value
  const vals = series.flatMap(sr => sr.pts.map(p => p[1])).concat(showAI ? [anchor] : []);
  const vlo = Math.min(...vals), vhi = Math.max(...vals);   // the real range: tick labels stay within it
  const pad = (vhi - vlo) * 0.08 || 1, lo = vlo - pad, hi = vhi + pad;
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const f = curveFmt(m.key);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(m.label)} by rank">`;
  for (let i = 0; i <= 3; i++) {   // light grid, black tick labels
    const v = vlo + (vhi - vlo) * i / 3;
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e4e4e1"/>` +
         `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#111">${esc(f(v))}</text>`;
  }
  [[-14, "15k"], [-9, "10k"], [-4, "5k"], [1, "1d"], [5, "5d"], [9, "9d"], [ai, "AI"]].forEach(([r, t]) =>
    s += `<text x="${x(r)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="#111">${t}</text>`);
  s += `<line x1="${x(9)}" x2="${x(9)}" y1="${T}" y2="${H - B}" stroke="#bbb" stroke-dasharray="2 3"/>`;
  series.forEach(sr => {
    const d = sr.pts.map(([r, v], i) => `${i ? "L" : "M"}${x(r).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    s += `<path d="${d}" fill="none" stroke="${sr.col}" stroke-width="2" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ""}/>`;
    const [lr, lv] = sr.pts[sr.pts.length - 1];   // on to KataGo's own value (the interpolated stretch)
    if (showAI) s += `<path d="M${x(lr)},${y(lv)} L${x(ai)},${y(anchor)}" fill="none" stroke="${sr.col}" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8"/>`;
    sr.pts.forEach(([r, v]) => s += `<circle cx="${x(r)}" cy="${y(v)}" r="3" fill="${sr.col}" stroke="#fff" stroke-width="1"><title>${sr.name} ${rankText(r)}: ${f(v)} (median of that rank's games)</title></circle>`);
  });
  if (showAI) s += `<path d="M${x(ai)} ${y(anchor) - 6} L${x(ai) + 6} ${y(anchor)} L${x(ai)} ${y(anchor) + 6} L${x(ai) - 6} ${y(anchor)} Z" fill="#111"><title>KataGo's own play: ${f(anchor)} (level 12, AI)</title></path>`;
  s += `<text x="${L}" y="${H - 4}" font-size="11" fill="#111">declared rank →</text></svg>`;
  return s;
}
function rankCurves() {
  const model = window.GR_RANK_GRAPH;
  if (!model) { main.innerHTML = "<p>No rank curves in this data.</p>"; return; }
  const card = m => `<div class="card curvecard"><h3>${esc(m.label)}</h3>
    <div class="unit">${m.sign > 0 ? "higher = stronger" : "lower = stronger"}${CURVE_TIP[m.key] ? " · " + esc(CURVE_TIP[m.key]) : ""}</div>${curveChart(m, model)}</div>`;
  const legend = `<div class="curvelegend">${CURVE_SERIES.map(([, n, c, d]) => `<span><svg width="26" height="10"><line x1="0" x2="26" y1="5" y2="5" stroke="${c}" stroke-width="2.5" ${d ? `stroke-dasharray="${d}"` : ""}/></svg> ${n}</span>`).join("")}
    <span><svg width="12" height="12"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#111"/></svg> KataGo's own play (AI, 12)</span></div>`;
  // (both servers together)
  const help = helpButton("Rank curves", `<p>V3: for each Fox rank, the median of its games on one measure. Dotted: on to AI.</p>
    <p>Colours: whole game, opening, middle, endgame.</p>
    <p>A game is read off the weighted curves; the reference curves do not count.</p>`);
  main.innerHTML = `<h2>Rank curves ${help}</h2><p class="sub">V3 · ${esc(model.created)} · ${model.trained_on_games.toLocaleString()} games</p>${legend}
    <div class="curvegrid">${model.measures.filter(m => m.grade !== false).concat(model.measures.filter(m => m.grade === false)).map(card).join("")}</div>`;
}

// ---- one game ---------------------------------------------------------------------------------------
let cur = { id: null, game: null, move: 0 };

const GAME_TABS = [["timeline", "Timeline"], ["phases", "Phases"], ["problems", "Problem moves"], ["charts", "Charts"],
  ["where", "Area Chart"], ["moves", "All moves"]];
// The performance table, after Zhangqi's report (the user, 2026-11-27: "make the performance a table similar to
// ZhangQi"): the level played and the main measures for the whole game and for each phase, Black and White side by
// side. A phase's rank reads that phase's measures off the phase's own rank curves (V3); V4nn rates the whole game.
function perfTable(groups, ph) {
  if (!groups || !groups.length) return "";
  const has = v => v !== null && v !== undefined && v !== "";
  const RANGE = { overall: "", opening: "Moves 1–60", middle: "Moves 61–150", end: "Moves 151+" };
  const cols = [["top1", "Best Move %"], ["match_pct", "Match %"], ["mean_loss", "Avg Point Loss"], ["difficulty_9d", "Game Difficulty (9d) %"]];
  const rank = r => { const v = r.phase === "overall" ? r.performance : r.x_rank_v3;
    return !has(v) ? "–" : rankText(+v) + (r.phase === "overall" && has(r.performance_sd) ? ` <span class="pm">± ${(+r.performance_sd).toFixed(1)}</span>` : ""); };
  const row = (g, i) => { const r = g.rows[ph];
    return `<tr class="${i % 2 === 0 ? "shade" : ""}"><td class="l"><span class="who"><span class="stone" style="background:${g.color === "W" ? "#fafaf7" : "#1f1f1e"}"></span>${esc(g.label)}</span></td>` +
      (r ? `<td><b>${rank(r)}</b></td>` + cols.map(([k]) => `<td>${esc(fmt(k, r[k]))}</td>`).join("") : `<td colspan="${cols.length + 1}">–</td>`) + `</tr>`; };
  return `<div class="card perfcard"><div class="gtabs">` + PHASES.map(p => `<button data-pph="${p}" class="${p === ph ? "on" : ""}">${PHASE_NAMES[p]}</button>`).join("") +
    `<span class="perfrange">${RANGE[ph]}</span></div><table><tr><th class="l">Player</th><th>Rank (V3)</th>` + cols.map(([, t]) => `<th>${head(t)}</th>`).join("") + `</tr>` +
    groups.map(row).join("") + `</table></div>`;
}
function playerCard(g, c, r, phases) {   // phases: the player's rows per phase, once the game's file is loaded
  const v = (k, f) => r && r[k] !== null && r[k] !== undefined && r[k] !== "" ? f(r[k]) : "–";
  // the level played in each part of the game (the user, 2026-11-27): the same measures read off each phase's curves
  const phaseRank = ph => { const p = phases && phases[ph]; return p && p.x_rank_v3 != null && p.x_rank_v3 !== "" ? rankText(+p.x_rank_v3) : "–"; };
  const byPhase = phases ? `<div class="perflabel">By phase (V3): ` + PHASES.map(ph => `${PHASE_NAMES[ph]} <b>${ph === "overall" && r && r.performance != null ? rankText(r.performance) : phaseRank(ph)}</b>`).join(" · ") + `</div>` : "";
  return `<div class="pcard"><div class="who"><span class="stone" style="background:${c === "B" ? "#1f1f1e" : "#fafaf7"}"></span>${esc(COLOR_NAMES[c])} · ${esc(playerInfo(g, c))}</div>
    <div class="perf">${r && r.performance != null ? `${rankText(r.performance)} <small>± ${r.performance_sd.toFixed(1)}</small>` : "–"}</div>
    ${r && r.performance == null ? `<div class="pnote">${noKomi(r) ? "Not graded: no komi" : "Not graded: too few moves"}</div>` : ""}
    <div class="perflabel">V3</div>
    <div class="perflabel">V4nn <b>${r && r.x_rank_v4 != null && r.x_rank_v4 !== "" ? rankText(+r.x_rank_v4) : "–"}</b></div>
    <div class="note">${esc(perfNote(r))}</div>
    <div class="kpis">
      <div class="kpi"><div class="v">${v("accuracy", x => (+x).toFixed(1))}</div><div class="l">Accuracy</div></div>
      <div class="kpi"><div class="v">${v("match_pct", x => (+x).toFixed(1) + " %")}</div><div class="l">Match %</div></div>
      <div class="kpi"><div class="v">${v("mean_loss", x => (+x).toFixed(2))}</div><div class="l">Avg Point Loss</div></div>
      <div class="kpi"><div class="v">${v("hard_found_pct", x => Math.round(+x) + " %")}</div><div class="l">Key Move Found %</div></div>
    </div></div>`;
}
function gameView(id) {
  const g = gameIndex()[id];
  if (!g) { main.innerHTML = partsLoaded < (data.game_parts || 0) ? `<p>Loading the games…</p>` : `<p>Game not found.</p>`; return; }
  cur = { id, game: null, move: 0, tab: (cur && cur.tab) || "timeline" };
  const any = (g.players.B || g.players.W).overall || {};
  main.innerHTML = `<button class="back" id="back">← All games</button>
    <h2>${esc(g.file)} · ${esc(any.date || "")} · ${handicapLabel(any)}${any.komi !== "" && any.komi !== undefined ? " · komi " + esc(any.komi) : ""}</h2>
    ${["B", "W"].some(c => g.players[c] && g.players[c].overall && g.players[c].overall.complete === 0) ? `<p class="muted">Partial: not in totals.</p>` : ""}
    ${["B", "W"].some(c => g.players[c] && g.players[c].overall && g.players[c].overall.external) ? `<p class="gapnote">Tournament game: graded, not in totals.</p>` : ""}
    ${["B", "W"].some(c => g.players[c] && g.players[c].overall && g.players[c].overall.wide_gap) ? `<p class="gapnote">Rank gap over 2: graded, not in totals.</p>` : ""}
    <div class="pcards" id="pcards">${["B", "W"].filter(c => g.players[c]).map(c => playerCard(g, c, g.players[c].overall)).join("")}</div>
    <div id="perftable"></div>
    <div id="movestrip" class="card movestrip"></div>
    <div class="gv">
      <div id="boardbox" class="card gv-board">Loading…</div>
      <div class="card gv-panel"><div class="gtabs" id="gtabs">${GAME_TABS.map(([k, n]) => `<button data-tab="${k}" class="${k === cur.tab ? "on" : ""}">${n}</button>`).join("")}</div>
        <div id="gpanel">Loading…</div></div>
    </div>
`;
  document.getElementById("back").onclick = () => show("games");
  document.getElementById("gpanel").addEventListener("click", e => {   // sub-tabs: Phases (phase), Area Chart (player)

  document.getElementById("gtabs").onclick = e => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    cur.tab = b.dataset.tab;
    document.querySelectorAll("#gtabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === cur.tab));

  };
  loadGame(id, data => {
    if (!data || cur.id !== id) return;
    cur.game = data;
    if (data.rows) {   // this game's rows for every phase come with its file (the summary has Overall only)
      const byColor = {};
      data.rows.forEach(r => ((byColor[r.color] = byColor[r.color] || {})[r.phase] = r));
      cur.groups = ["B", "W"].filter(c => byColor[c]).map(c => ({ label: `${COLOR_NAMES[c]} · ${playerInfo(g, c)}`, rows: byColor[c], color: c }));
      document.getElementById("pcards").innerHTML = ["B", "W"].filter(c => byColor[c]).map(c => playerCard(g, c, byColor[c].overall, byColor[c])).join("");
      const drawPerf = () => { document.getElementById("perftable").innerHTML = perfTable(cur.groups, cur.perfPhase || "overall"); };
      document.getElementById("perftable").onclick = e => { const b = e.target.closest("[data-pph]"); if (b) { cur.perfPhase = b.dataset.pph; drawPerf(); } };
      drawPerf();

    cur.move = Math.min(1, data.board ? data.board.moves.length : 0);   // move 0 on screen: the empty board, Black to play

}

// The analysis panel: one tab at a time; the tabs that follow the board (timeline, charts) redraw as the move changes.

  if (cur.tab === "timeline") box.innerHTML = timelineChart(d) || `<p>No timeline for this game.</p>`;
  else if (cur.tab === "phases") box.innerHTML = cur.groups ? butterfly(cur.groups) : "";
  else if (cur.tab === "problems") box.innerHTML = problemMoves(d);
  else if (cur.tab === "charts") {
    const spans = spansOf(d.moves.B, "B").concat(spansOf(d.moves.W, "W"));
    box.innerHTML = `<div class="keys"><span style="--c:${SIDE.B}">Black</span><span style="--c:${SIDE.W}">White</span><span style="--c:#eb6834">Tough Spot</span><span style="--c:#2a78d6">current move</span></div>` +
      perMoveChart("Point Loss", "points (capped at 15); dashed lines: Opening | Middle | Endgame", d.moves, "loss",
        { bars: true, tf: v => Math.max(0, v), max: 15, tip: tipf, cursor: cur.move }) +
      perMoveChart("Position Difficulty (9d)", "how often a 9d would go wrong in this position, %; dots: Tough Spots", d.moves, "p_err_9d",
        { tf: v => 100 * v, max: 100, mark: mm => mm.p_err_9d >= 0.5, tip: tipf, cursor: cur.move }) +
      perMoveChart("Engine Likeness", "P(AI-assisted), % (uncalibrated); shaded: AI-like spans" + (spans.length ? " — " + spans.map(s => `${COLOR_NAMES[s[2]]} ${s[0] === s[1] ? s[0] : s[0] + "–" + s[1]}`).join(", ") : ""),
        d.moves, "p_assisted", { tf: v => 100 * v, max: 100, spans, tip: tipf, cursor: cur.move });
  } else if (cur.tab === "where") {   // Area Chart: one player at a time (sub-tabs Black / White)

      `<div class="gtabs" style="margin-bottom:8px">${["B", "W"].map(c => `<button data-area="${c}" class="${c === side ? "on" : ""}">${COLOR_NAMES[c]}</button>`).join("")}</div>` +
      `<div class="wheregrid">${whereCard(d, side)}</div>`;
  }
  else if (cur.tab === "moves") {
